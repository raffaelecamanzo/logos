reason = "Checkov CKV_GHA_7 on the workflow_dispatch `tag` input of .github/workflows/release.yml: the input only selects an existing release tag. scripts/release-tag-guard.sh runs in `plan` before dist is installed or anything is built, and refuses a tag that is not vMAJOR.MINOR.PATCH[-SUFFIX], that the checkout does not hold, whose commit is not HEAD, or that already has a GitHub Release; every later job reads the tag only from the guard's output, and `host` runs the guard again with the validated commit. The build output is therefore decided by the tag's commit, not by free text in the input. Checkov keys this finding by its line range in release.yml (84-92 at HF-4), so an edit above the `tag` input moves it and the entry then needs the new fingerprint."

