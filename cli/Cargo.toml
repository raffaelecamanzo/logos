[package]
# Package name == the distributed app name: cargo-dist derives artifact names
# (logos-<target>.tar.xz), the Homebrew formula (logos.rb → `brew install
# <tap>/logos`, FR-IN-05), and the installer URL from it. The directory stays
# `cli/` (the adapter role, ADR-01); only the package identity is `logos`.
name    = "logos"
version.workspace = true
edition = "2021"
description = "Logos — structural code intelligence for AI-assisted development"
license.workspace = true
repository.workspace = true
# The Homebrew formula's homepage field (cargo-dist publish-jobs).
homepage = "https://github.com/raffaelecamanzo/logos"
# Internal workspace crate — never published to crates.io. It builds the single
# distributed `logos` binary (ADR-16).
publish = false

# cargo-dist (S-023, FR-DS-01, ADR-16): this is the one distributed package —
# `publish = false` keeps it off crates.io, so dist needs the explicit opt-in.
[package.metadata.dist]
dist = true
# No `features` list: the default feature set (`lang-all` + `ui`, below) is the
# build this repository ships, the dashboard included (S-287, CR-078/ADR-60), and
# it composes no extension (FR-DS-05).

# The CLI as a library (CR-213, ADR-74): `logos_cli::run(ExtensionHost)` is the
# entry a binary's `main` — the composition root — calls with its extensions.
# Named `logos_cli` so it does not collide with the binary below.
[lib]
name = "logos_cli"
path = "src/lib.rs"

# The single `logos` binary target (ADR-16, NFR-PC-01): the composition root, a
# thin `main` that registers the extensions its build includes.
[[bin]]
name = "logos"
path = "src/main.rs"

[features]
# The shipped binary carries the five v1 grammars by default (FR-PL-01),
# matching logos-core's own default since S-015. `lang-rust` remains for slim
# development builds (`--no-default-features --features lang-rust`). Feature
# lines forward to BOTH paths into logos-core (direct and via mcp) so the
# grammar set unifies regardless of which seam pulls it in.
#
# `ui` joined the default set (S-287, CR-078/ADR-60): the no-network fitness
# function's full denylist moved from the DEFAULT tree to the SLIM tree
# (`--no-default-features --features lang-all`, S-288) — a plain
# `cargo build`/`cargo install` ships the dashboard, which listens but links no
# egress client, and the offline-by-default invariant (NFR-SE-01) is enforced
# over the slim build. The default build composes no extension (FR-DS-05).
default   = ["lang-all", "ui"]
# The `web?/lang-*` weak-forward lines reach the web adapter's logos-core path
# only when the `ui` feature has pulled it in, keeping the grammar set unified
# across every seam (the mcp pattern, extended to the third adapter, CR-012).
lang-rust = ["logos-core/lang-rust", "mcp/lang-rust", "web?/lang-rust"]
lang-all  = ["logos-core/lang-all", "mcp/lang-all", "web?/lang-all"]
# CR-012/ADR-27, re-layered by CR-078/ADR-60: the localhost web UI. Enabling it
# links the axum web surface into the binary (`serve --ui`/`--port`); since
# CR-078/ADR-60 it is default and egress-free — it links no HTTP client. The
# slim, listener-free build stays reachable via `--no-default-features
# --features lang-all` (no `--ui`, no axum/hyper in the dependency tree,
# NFR-SE-01).
ui        = ["dep:web"]

[dependencies]
logos-core = { path = "../logos-core", default-features = false }
# The extension host (CR-213, ADR-74): the library composes the active
# extensions' subcommands and init steps from it and hands it to every surface.
# A contract crate, never an extension crate — only `main` names extensions.
logos-ext  = { path = "../logos-ext" }
# The rmcp stdio server behind `logos serve --mcp` (S-017 service contract:
# the serve arm calls `mcp::serve_stdio(root)` and maps Err → exit 3). Grammar
# features stay controlled by this crate's feature lines above.
mcp        = { path = "../mcp", default-features = false }
# The feature-gated web adapter (CR-012, ADR-27) — optional, behind `ui`, which
# is default since S-287 (CR-078/ADR-60). It is now part of the default-feature
# dependency tree; the offline-by-default no-network fitness function moved to
# guard the slim tree instead (`--no-default-features --features lang-all`,
# S-288), the same scope cargo-deny's default-features graph now covers.
web        = { path = "../web", default-features = false, optional = true }
anyhow     = { workspace = true }
clap       = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# The stub extension the composition-root tests drive through `logos_cli::run_from`
# (S-639) — dev-only, so it never reaches the shipped binary.
logos-ext  = { path = "../logos-ext", features = ["test-support"] }
# End-to-end binary tests (tests/cli_surface.rs and the S-019 binary-level
# stdout-safety test, NFR-RA-01): throwaway project fixtures — dev-only,
# never enters the shipped binary graph.
tempfile   = { workspace = true }
# tests/init_workspace.rs (S-246, FR-WS-02): parses the JSON report and
# `.mcp.json` to assert on structured fields — dev-only.
serde_json = { workspace = true }
# The S-427 CLI↔HTTP agreement test (tests/xservice_surface.rs, [FR-WS-28]):
# `federation::reach` and `federation::governance` now answer on BOTH surfaces,
# and [ADR-01] is satisfied only if the two renderings of one read-model agree
# field-for-field. Asserting that needs one test that drives the real `logos`
# binary AND the real axum router over the SAME workspace — and this is the only
# crate where both are reachable: `CARGO_BIN_EXE_logos` exists only in this
# package's tests, and `web` is already a dependency here (behind the default
# `ui` feature). These four are the in-process router harness the `web` crate's
# own tests use; all four are dev-only, so none enters the shipped binary graph
# the no-network fitness function scans (NFR-SE-01).
axum           = "0.7"
tower          = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tokio          = { workspace = true, features = ["rt", "macros"] }
# tests/extension_host.rs (S-644): a real, older-schema `.logos/wiki.db` a build
# that composes no extension must leave untouched. Test-only.
rusqlite       = { workspace = true }

[lints]
workspace = true
