[package]
name    = "logos-wiki"
version.workspace = true
edition = "2021"
description = "Logos source wiki — the .logos/wiki.db store, its tiers and its operations over &Engine (CR-008, CR-213, ADR-24, ADR-74)"
license.workspace = true
# Never published to crates.io: it ships inside the single `logos` binary like
# every other member (ADR-16).
publish = false

[features]
# The presented tier's reference rewriter (FR-WK-25) parses markdown with the
# same `tree-sitter-md` grammars the core's doc extractor links. Inside the core
# it was gated on the core's own `lang-markdown`; out here it needs a feature of
# its own, which turns the core's on too, so the rewriter never runs without the
# core's markdown grammar. Without it the rewriter is the identity, as it was in
# a markdown-less core.
#
# Dependents take this crate with `default-features = false` and turn the
# feature on from the same `lang-all` line that turns the core's grammars on, so
# a surface's `lang-*` lines alone still decide what the core indexes: the
# documented Rust-only build (`--no-default-features --features lang-rust`)
# links neither, exactly as before the move. The default here is only this
# crate's own test build, which ran under the core's default grammars while it
# lived in logos-core. `tests/markdown_feature.rs` pins both halves. `web` is in
# it for the same reason: the extension's route suites need it, and every
# dependent takes this crate with `default-features = false` and turns `web` on
# from its own `ui` feature.
default       = ["lang-markdown", "web"]
lang-markdown = ["logos-core/lang-markdown", "dep:tree-sitter", "dep:tree-sitter-md"]
# The wiki's web surface (S-644): its read routes, the generation trigger and the
# Dashboard field, contributed through the extension host's `web` contribution
# point. The `logos` binary turns it on from its `ui` feature, so the slim,
# listener-free build (no `ui`) links no axum/hyper through this crate either
# (NFR-SE-01). No egress client is reachable from here: the in-app generator is
# the `wiki-agent`'s, handed to the extension by the binary's `main` under `agents`.
web = ["logos-ext/web", "dep:web", "dep:axum", "dep:tokio", "dep:tokio-stream", "dep:comrak"]

[dependencies]
# The wiki works over `&Engine` (wiki-engine → api-facade): it reads the graph
# through the core's read-only pool and reports through the core's telemetry
# chokepoint, so it sits ABOVE logos-core. The core never depends on this crate
# (it would be a cycle); it reaches the wiki's `init -i` step only through the
# core-owned `init::InitContribution` seam (S-644, ADR-74).
logos-core = { path = "../logos-core", default-features = false }
# The extension contract (S-644): this crate implements `Extension`; its MCP tools
# are `McpTool`s, its subcommand a `CliCommand`, its routes `WebRoute`s.
logos-ext  = { path = "../logos-ext" }
anyhow     = { workspace = true }
# The `logos wiki` subcommand's definition (moved verbatim from the CLI's derive).
clap       = { workspace = true }
# The MCP tools' `tools/list` definitions are rmcp's own `Tool`, and their input
# schemas are generated by the rmcp function the `#[tool]` macro calls, so they
# stay byte-identical to the `#[tool]`s they were.
rmcp       = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
tracing    = { workspace = true }
# `wiki.db` is its own SQLite file with an FTS5 index (BR-29, FR-WK-05); the
# same bundled rusqlite the core links, so no second SQLite enters the binary.
rusqlite   = { workspace = true }
# Anchor content hashes (FR-WK-03), the same hash the core's sync uses.
blake3     = { workspace = true }
# The markdown grammars behind `lang-markdown`, at the versions the core links,
# so the build carries one tree-sitter runtime and one copy of each grammar
# (NFR-PC-05). `default-features = false` drops tree-sitter-md's `parser`
# wrapper and the second tree-sitter it pulls, as the core does.
tree-sitter    = { version = "0.25", optional = true }
tree-sitter-md = { version = "0.5", optional = true, default-features = false }
# ── The `web` feature: the web adapter's public helpers (the member extractor,
# the blocking bridge, the JSON replies), so a wiki route resolves a request
# exactly as a core route does. The edge runs extension → `web`, never the reverse
# (ADR-74 §3); `web` is taken without features, so it links no agent crate.
web          = { path = "../web", default-features = false, optional = true }
axum         = { version = "0.7", optional = true }
# The generation run's lifetime is owned by a detached task and fanned out over a
# `broadcast` channel the SSE body subscribes to (S-178, S-222, CR-056).
tokio        = { workspace = true, features = ["rt", "sync", "time"], optional = true }
tokio-stream = { version = "0.1", default-features = false, features = ["sync"], optional = true }
# The page renderer (S-136, CR-035): CommonMark + GFM to already-safe HTML on the
# server (`render.r#unsafe = false`), the wiki's XSS boundary. `default-features =
# false` drops comrak's `cli` bundle.
comrak       = { version = "0.52.0", default-features = false, optional = true }

[dev-dependencies]
# The moved tests index real fixtures under the core's default grammar set —
# the build they ran in while they lived in logos-core.
logos-core = { path = "../logos-core" }
serde_json = { workspace = true }
tempfile   = { workspace = true }
# The extension's suites drive it through the surfaces that compose it, as the
# `logos` binary does: the MCP server over an in-process client (`wiki_parity`,
# the tool roster), and the web router in-process without a socket (the read,
# generation and overview suites). Dev-only edges from this crate to the
# adapters — the direction ADR-74 §3 allows; no adapter depends on this crate.
mcp            = { path = "../mcp", default-features = false }
rmcp           = { workspace = true, features = ["client"] }
tokio          = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net", "time", "io-util"] }
tower          = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
rusqlite       = { workspace = true }
# The `[wiki]` claim's validation is exercised over a table value, as the core's
# config routing hands it (`extension_surface.rs`).
toml           = { workspace = true }
