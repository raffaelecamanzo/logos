[package]
name    = "logos-chat"
version.workspace = true
edition = "2021"
description = "The chat extension — the agentic chat over the code graph, composed through the extension host (CR-213, S-643)"
license.workspace = true
# Never published to crates.io: it ships inside the `logos` binary like every
# other member (ADR-16), and a build can leave it out.
publish = false

# No features of its own. The crate IS the `agents`-only chat surface: the `logos`
# binary links it only under its `agents` feature (cli/Cargo.toml), and only its
# `main` names it (ADR-74 §3) — so a build without `agents` carries no chat route,
# no `chat.db` and, through `agent-core`, no `rig`/`reqwest` (NFR-SE-01, ADR-60).

[dependencies]
logos-core = { path = "../logos-core", default-features = false }
# The extension contract: this crate implements `Extension`, and its routes are
# `WebRoute`s (the `web` contribution point).
logos-ext  = { path = "../logos-ext", features = ["web"] }
# The web adapter's public helpers — the member/workspace extractors, the
# blocking bridge, the not-a-workspace `404` — so a chat route resolves a request
# exactly as a core route does. The edge runs extension → `web`, never the
# reverse (ADR-74 §3). `web` has no `agents` feature (S-644): it links no agent
# crate in any build.
web        = { path = "../web", default-features = false }
# The rig substrate and the chat orchestrator + conversation store (CR-045/046,
# ADR-40/41) — chat's half of the LLM egress carve-out; the wiki generator
# (`wiki-agent`) is the other, and `web`'s tree holds neither.
agent-core = { path = "../agent-core", default-features = false }
chat-agent = { path = "../chat-agent", default-features = false }
anyhow     = { workspace = true }
axum       = "0.7"
serde      = { workspace = true }
tokio      = { workspace = true, features = ["rt", "time", "macros", "sync"] }
# The turn's `mpsc` event channel as the `Stream` the SSE body consumes.
tokio-stream = { version = "0.1", default-features = false }
tracing    = { workspace = true }

[dev-dependencies]
# Compose the extension into a host the router serves, beside the stub.
logos-ext      = { path = "../logos-ext", features = ["web", "test-support"] }
# Drive the composed router in-process without binding a socket.
tower          = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serde_json     = { workspace = true }
tempfile       = { workspace = true }
rusqlite       = { workspace = true }
# `test-util` gives the keepalive test (tests/chat_sse.rs, S-626) tokio's paused
# clock, so 45 s of observed silence costs no wall time.
tokio          = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net", "time", "io-util", "test-util"] }
# The suites that index a real Rust fixture (a grounded turn needs a graph).
logos-core     = { path = "../logos-core", features = ["lang-rust"] }
# The workspace tools' MCP-parity suite (tests/mcp_parity_workspace_tools.rs, HF-2,
# moved from `web` with the last agent edge, S-644) calls the MCP tools over the
# real protocol through `mcp/tests/support/federated.rs`. Dev-only.
mcp            = { path = "../mcp", default-features = false }
rmcp           = { workspace = true, features = ["client"] }
