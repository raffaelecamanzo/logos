[package]
name    = "logos-ext"
version.workspace = true
edition = "2021"
description = "Logos extension host — the one contract optional capabilities compose through (CR-213, ADR-74, ADR-75)"
license.workspace = true
# Never published to crates.io: it ships inside the single `logos` binary like
# every other member (ADR-16).
publish = false

[features]
default = []
# The web contribution point (`Extension::web_routes`). Off unless the `web`
# adapter turns it on, so the slim, listener-free build reaches no axum/hyper
# through this crate (NFR-SE-01, kept honest by logos-core's no-network test).
web = ["dep:axum"]
# The stub extension and test feature gate every surface's tests compose
# (`logos_ext::testing`). Enabled only as a dev-dependency, so it never reaches
# a shipped binary.
test-support = []

[dependencies]
# Extensions work over `&Engine` (extension-host → api-facade): the host's
# contract names core types, which is why this crate sits ABOVE logos-core and
# the core reaches it only through core-owned traits it implements
# (`init::InitContribution`).
logos-core = { path = "../logos-core", default-features = false }
anyhow     = { workspace = true }
clap       = { workspace = true }
# The MCP contribution point carries rmcp's own `Tool` definition, so an
# extension's `tools/list` entry is the very type the server serialises.
rmcp       = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
axum       = { version = "0.7", optional = true }

[dev-dependencies]
tempfile = { workspace = true }
