# Declarative descriptor for the Ruby grammar (S-059, CR-009, FR-PL-07,
# FR-FW-03, ADR-09). Embedded via `include_str!` (plugin::grammars::compiled)
# and parsed at startup by the LanguageRegistry. Droppable `.scm` query
# overrides resolve under `.logos/plugins/ruby/queries/` (FR-PL-04, UAT-PL-03).

name = "ruby"
extensions = ["rb", "rake", "ru", "gemspec"]

# Ruby's build files (S-564, CR-179, FR-EX-26): `*.rake` tasks, a rackup
# `config.ru` and a `*.gemspec` are claimed by extension, and the two files that
# carry no extension by basename. The exact name only: a code plugin's claim
# never takes the `Name.*` variants an artifact's does, so `Gemfile.lock` (a
# lockfile, not Ruby) stays unclaimed.
filenames = ["Gemfile", "Rakefile"]

# Ruby joins namespace segments with `::` (`ActiveRecord::Base`). Surfaced by
# `logos languages` (FR-PL-06); reference extraction canonicalises paths into
# the `::`-joined ledger form.
module_separator = "::"

# A `require`/`require_relative` string is a path, not a constant (S-566,
# CR-179, FR-RS-34): only `/` separates, and `..` is kept. `references.scm`
# marks a `require_relative` relative to the requiring file's directory, so
# `require_relative 'abstract/handler'` and `'../lib/rack/lint'` name the file
# they load; a trailing `.rb` names the file itself. A bare `require 'a/b'`
# binds against the load roots — each gem's `require_paths` (`lib/` unless its
# `*.gemspec` says otherwise) and the repository root — to exactly one file, and
# one no root holds (`require 'json'`, an external gem) stays unbound.
import_specifier = "path"
specifier_extensions = ["rb"]
bare_specifiers = "load-path"

# tree-sitter-ruby 0.23 is generated against ABI 14; asserted at load against
# the compiled grammar (FR-PL-03, NFR-PC-03).
abi_version = 14

capabilities = ["symbols", "references", "frameworks", "invocations", "locals"]

# Decision-point tokens for the cyclomatic-complexity keyword walk (FR-EX-03).
# Anonymous-token kinds in the Ruby grammar: branching keywords, loop keywords,
# case arms, exception arms, boolean operators, and the ternary `?`. `else` is
# excluded — it adds no independent decision path (McCabe).
complexity_keywords = ["if", "elsif", "unless", "while", "until", "for", "when", "rescue", "&&", "||", "and", "or", "?"]

# Block-structure nesting node kinds for per-function max nesting depth (CR-005,
# FR-EX-07): the Ruby control-flow compound nodes plus the block forms, because
# Ruby's dominant looping construct is the iterator block (`items.each do … end`)
# rather than a `for` statement. Depth 0 is a flat body; each nested node adds one.
nesting_block_kinds = ["if", "unless", "while", "until", "for", "case", "case_match", "begin", "do_block", "block"]

# An unqualified call inside a class body is a call on the current instance
# (S-515, CR-169): Ruby's implicit receiver is `self`. `references.scm` marks
# every receiver-less call `@ref.receiver.implicit`; inside a named class it
# records the `self` shape, anywhere else the free call it always was.
implicit_receiver = "self"

# A bare call never names a local value (S-594, FR-RS-44): `f()` with
# parentheses calls the method even where a local `f` is assigned — the parser
# reads the bare `f` as that local. A local binding shadows no call here.
separate_call_namespace = true

# The optional member-access capability (S-569, CR-179, FR-EX-27, ADR-39):
# Cohesion scores a class only in a language that declares it. Ruby's queries
# capture `@x` instance-variable reads and writes as Accesses edges
# (`queries/references.scm`, `@ref.access`), bound to the Fields its classes
# declare from `attr_*` and `@x = …` (`queries/symbols.scm`, S-564), so its
# classes' LCOM4 has its shared-field links. A bare `x` that calls an `attr_*`
# reader is a call, not an access, and links nothing.
member_access = true

# Ruby methods are public by default; `private`/`protected` are dynamic
# visibility calls whose effect on subsequent definitions a structural pass
# cannot read reliably (best-effort per CR-009). `all` is the safe,
# under-reporting direction (AR-05): every declaration is treated as exported,
# so exported-is-live can only miss dead code, never flag a live symbol dead.
export_convention = "all"

# How Ruby marks a function as a test (S-059, FR-EX-06, ADR-18): a minitest
# `test_*`-named method, or a method/example lexically enclosed by (or being) an
# RSpec `it`/`describe`/`context` block call. Feeds the unified `is_test`
# annotation (FR-AN-05).
test_convention = "ruby-test"

# The ratified v1 Ruby framework set (FR-FW-03): Rails. A file whose reference
# ledger names a Rails constant (`Rails`, `ApplicationController`,
# `ApplicationRecord`, `ActiveRecord`, …) becomes a framework candidate
# (FR-FW-04 ledger-gated candidacy).
framework_detectors = ["Rails", "ActionController", "ActiveRecord", "ApplicationController", "ApplicationRecord", "ActionMailer", "ActiveJob"]

# Canonical reference prefixes whose presence in a file's ledger makes the file
# an outbound **HTTP client-call** candidate (S-347, CR-108, FR-WS-08) — the
# consumer-side twin of `framework_detectors`. FR-WS-08's normative Ruby row is
# Net::HTTP and Faraday, and both rows are the ledger form of a `require`
# import, not the constant's own spelling: `require "net/http"` and
# `require "faraday"` canonicalise as path specifiers (S-566; every `/` a
# segment boundary, S-345's `net/http` → `net::http` verbatim), giving
# `net::http` and `faraday` — lowercase,
# because the require STRING is lowercase even though the constant used at the
# call site (`Net::HTTP`, `Faraday`) is not. Matched at a segment boundary
# (`resolve::matches_detector`), so `net::http` also admits a
# `net::http::persistent`-style extension without admitting the sibling
# `net::ftp` / `net::smtp` stdlib siblings.
http_client_detectors = ["net::http", "faraday"]

# Ruby names a class or module by its constant (S-565, CR-179, FR-RS-33): every
# `class`/`module` declaration is the constant its nesting spells (`A::B::C`,
# the compact `class A::B` included), reopenings of one name are one constant,
# and a constant reference is read the way Ruby reads it — the lexical nesting
# outward, then the top level. A call on a constant (`Foo.bar`, `A::B.bar`)
# binds among that constant's singleton methods and module functions, and
# `Foo.new` instantiates it. Files keep their path-derived module keys.
[module_model]
kind = "path"
lexical_constants = true

# Declared cross-file reach (S-570, CR-180, FR-PL-09): a call on a constant
# binds across files, and so does the class a `Foo.new` instantiates (S-565),
# and the file a `require`/`require_relative` loads (S-566); every other
# reference binds only inside the file that wrote it.
# Verified by `tests/reach_declared.rs`, which indexes a fixture and fails when a
# declared relation binds nothing across files or an undeclared one does — a
# change that alters this language's reach updates this table in the same change.
[reach]
level = "partial"
cross_file = ["calls", "imports", "type_relations"]

[queries]
symbols = "queries/symbols.scm"
references = "queries/references.scm"
frameworks = "queries/frameworks.scm"
# Outbound Net::HTTP / Faraday client-call arm (S-347, CR-108, FR-WS-08): the
# receiver-method idiom (parenthesised and parenthesis-free alike), the
# `Net::HTTP.get(URI(...))` constructor-wrapped path, and a symbol-keyed hash
# call. See the query header for the registration-vs-client discriminator.
invocations = "queries/invocations.scm"
# The names a callable body binds locally, each with its kind, scope and
# position (S-593, CR-191, FR-EX-33): facts only, read by no edge.
locals = "queries/locals.scm"
# Captured `@fw.route.method` text → HTTP method (the declarative framework
# contract, S-015). Rails routing-DSL verbs map to their HTTP verb, and `root`
# is a `GET` of the path the blocks around it give (S-567); the RESTful macros
# (`resources`/`resource`) carry no single path and are deliberately unmapped —
# an unmapped method drops the match (FR-FW-04), so the pass never fabricates
# the seven routes a `resources` macro expands to.
[framework_methods]
root = "GET"
get = "GET"
post = "POST"
put = "PUT"
patch = "PATCH"
delete = "DELETE"
head = "HEAD"
options = "OPTIONS"
