# Declarative descriptor for the Python grammar (S-015, FR-PL-01, FR-FW-03,
# ADR-09). Embedded via `include_str!` (plugin::grammars::compiled) and parsed
# at startup by the LanguageRegistry. Droppable `.scm` query overrides resolve
# under `.logos/plugins/python/queries/` (FR-PL-04, UAT-PL-03).

name = "python"
extensions = ["py", "pyi"]

# Python joins module segments with a dot (`django.urls`). Surfaced by
# `logos languages` (FR-PL-06); reference extraction canonicalises dotted
# paths into the `::`-joined ledger form.
module_separator = "."

# tree-sitter-python 0.25 is generated against ABI 15; asserted at load
# against the compiled grammar (FR-PL-03, NFR-PC-03).
abi_version = 15

# An unqualified call (`m()`) is never a call on the current instance in
# Python: it is a free call, bound by scope (S-515, CR-169). Declared, not
# defaulted, so the choice is visible beside the receiver markers in
# `references.scm`.
implicit_receiver = "none"

capabilities = ["symbols", "references", "frameworks", "invocations"]

# Decision-point tokens for the cyclomatic-complexity keyword walk (FR-EX-03).
# Anonymous-token kinds in the Python grammar: branching keywords, loop
# keywords, exception arms, boolean operators, and ternary/match arms.
complexity_keywords = ["if", "elif", "else", "for", "while", "except", "and", "or", "case", "assert"]

# Block-structure nesting node kinds for per-function max nesting depth
# (CR-005, FR-EX-07): the Python compound statements. Depth 0 is a flat body;
# each nested compound statement adds one.
nesting_block_kinds = ["if_statement", "for_statement", "while_statement", "with_statement", "try_statement", "match_statement"]

# Python has no export keyword: the underscore convention marks privacy, so
# every name not starting with `_` is an exported dead-code root (FR-AN-01 —
# conservative in the safe, under-reporting direction).
export_convention = "underscore-private"

# How Python marks a function as a test (S-027, FR-EX-06, ADR-18): a `test_*`
# name (pytest) or a `test`-prefixed method of a `unittest.TestCase` subclass.
# Feeds the unified `is_test` annotation (S-028).
test_convention = "python-test"

# The ratified v1 Python framework set (FR-FW-03): FastAPI + Django. A file
# whose reference ledger names either becomes a framework candidate
# (FR-FW-04 ledger-gated candidacy).
framework_detectors = ["fastapi", "django"]

# Canonical reference prefixes whose presence in a file's ledger makes the file
# an outbound **HTTP client-call** candidate (S-344, CR-108, FR-WS-08) — the
# consumer-side twin of `framework_detectors`. FR-WS-08's normative Python row
# is `requests` and `httpx`, both genuine import module names (`import
# requests`, `import httpx`) — canonicalised by `references.scm`'s `@ref.import`
# capture into exactly these ledger targets — so, unlike TypeScript's `fetch`
# row, neither is a bare-identifier detector and the gate stays independent of
# the calls this arm itself captures (see `extract::capture_http_client_call_arm`
# for the general rule this row does NOT need the compensating scope for).
#
# `queries/invocations.scm` still anchors every pattern to a named client
# rather than shipping Rust's broad `<receiver>.<method>(<arg>)` anchor — a
# defensive choice this row does not oblige, made because FastAPI/Flask's own
# route-registration API is syntactically identical to a client call. See that
# file's header for the full rationale and its test pins.
http_client_detectors = ["requests", "httpx"]

# Python's module model is the path model with import roots (S-519, CR-170,
# FR-RS-14). A file is keyed by its path under its import root: `src/` when a
# package (a directory with an `__init__.py`) sits beneath it, otherwise the
# repository root, which is also where a file outside every root is keyed from.
# An `__init__.py` names its package's directory, every directory under a root
# is a module (so a namespace package without `__init__.py` still descends), and
# `.logos/config.toml`'s `[resolution.import_roots] python = [...]` replaces the
# detection. Python is its own family: its imports reach only Python modules.
[module_model]
kind = "path"
package_stems = ["__init__"]
import_roots = ["src"]
family = "python"

# Declared cross-file reach (S-570, CR-180, FR-PL-09): imports bind across files
# through the import-root module model (S-519), and so does a bare call to a name
# a `from m import f` brought into view. Type relations do not yet (S-522).
# Verified by `tests/reach_declared.rs`, which indexes a fixture and fails when a
# declared relation binds nothing across files or an undeclared one does — a
# change that alters this language's reach updates this table in the same change.
[reach]
level = "partial"
cross_file = ["calls", "imports"]

[queries]
symbols = "queries/symbols.scm"
references = "queries/references.scm"
frameworks = "queries/frameworks.scm"
# Outbound HTTP client-call arm (S-344, CR-108, FR-WS-08): `requests`/`httpx`
# module-level free functions and the `Session`/`Client` receiver idiom,
# including the inline `httpx.Client().get(…)` construction-and-call chain and
# an `await`-wrapped async client call. Anchors only — the HTTP-verb and
# static-literal decisions stay in the generic dispatch and
# `resolve::http_client_call`.
invocations = "queries/invocations.scm"
# Captured `@fw.route.method` text → HTTP method (the declarative framework
# contract, S-015). FastAPI decorator names map to their verb; Django URLconf
# registrations (`path`/`re_path`) carry no verb, so they map to ANY.
[framework_methods]
get = "GET"
post = "POST"
put = "PUT"
delete = "DELETE"
patch = "PATCH"
head = "HEAD"
options = "OPTIONS"
trace = "TRACE"
websocket = "ANY"
path = "ANY"
re_path = "ANY"
