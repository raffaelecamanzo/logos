# Declarative descriptor for the PHP grammar (S-060, CR-009, FR-PL-01,
# FR-FW-03, ADR-09). Embedded via `include_str!` and parsed at startup by the
# LanguageRegistry. Droppable `.scm` query overrides resolve under
# `.logos/plugins/php/queries/` (FR-PL-04, UAT-PL-03).

name = "php"
extensions = ["php"]

# PHP joins namespace segments with a backslash (`App\Services\UserStore`).
# Reference extraction canonicalises the separator into the `::`-joined ledger
# form the binder reads, exactly as the dotted Java/Python paths are.
module_separator = "\\"

# tree-sitter-php 0.24 is generated against ABI 15. Bound via its **full `php`
# grammar** (`LANGUAGE_PHP`) so HTML-interleaved templates parse and their PHP
# symbols still extract (see plugin::grammars::php_entry).
abi_version = 15

# An unqualified call (`m()`) is never a call on the current instance in
# PHP: it is a free call, bound by scope (S-515, CR-169). Declared, not
# defaulted, so the choice is visible beside the receiver markers in
# `references.scm`.
implicit_receiver = "none"

capabilities = ["symbols", "references", "frameworks", "invocations", "locals"]

# The optional member-access capability (S-523, CR-171, ADR-39): Cohesion
# scores a class only in a language that declares it, so a class of a language
# capturing no field access is not applicable rather than scored from calls alone.
# PHP's queries capture `$this->x` member access as Accesses edges
# (`queries/references.scm`, `@ref.access`), so its classes' LCOM4 has its
# shared-field links.
member_access = true

# Decision-point tokens for the cyclomatic-complexity keyword walk (FR-EX-03).
# `elseif` is PHP's own keyword; `?` covers the ternary and `?:`; `&&`/`||`
# plus the word forms `and`/`or`/`xor`; `catch` for try/catch.
complexity_keywords = ["if", "else", "elseif", "for", "foreach", "while", "do", "case", "catch", "&&", "||", "and", "or", "xor", "?"]

# Block-structure nesting node kinds for per-function max nesting depth
# (CR-005, FR-EX-07): PHP's control-flow statements. Depth 0 is a flat body;
# each nested statement adds one.
nesting_block_kinds = ["if_statement", "for_statement", "foreach_statement", "while_statement", "do_statement", "switch_statement", "try_statement", "match_expression"]

# Callable body node kinds for the has-body fact (S-500, CR-163, FR-EX-11): a
# Function/Method is implemented when its declaration is, or has a direct
# child of, one of these kinds — the method/function `compound_statement`. An `abstract` method and an
# interface method end in `;` and carry none.
body_node_kinds = ["compound_statement"]

# PHP's export rule (FR-AN-01): public-by-default — a declaration is exported
# unless a `visibility_modifier` child carries `private`/`protected`. Top-level
# functions and modifier-less members are public. (S-060 bounded variant — the
# inverse of Java's `public-modifier`; see plugin::manifest::ExportConvention.)
export_convention = "php-visibility"

# How PHP marks a method as a test (S-060, FR-EX-06, ADR-18): any of the three
# coexisting PHPUnit idioms — a `test`-prefixed name, a PHP 8 `#[Test]`
# attribute, or a `@test` docblock tag. Feeds the unified `is_test` annotation
# (S-028). (S-060 bounded variant — see plugin::manifest::TestConvention.)
test_convention = "php-unit"

# The ratified PHP framework set (FR-FW-03): Laravel and Symfony (S-549). The
# candidacy gate (FR-FW-04) promotes a file only once its ledger names the
# `Illuminate` or `Symfony` canonical prefix (`use Symfony\Component\Routing\
# Attribute\Route;` canonicalises to `Symfony::Component::…`), so a plain
# `Route::` static call or `#[Route]` attribute in a file that imports neither
# never fabricates a route.
framework_detectors = ["Illuminate", "Symfony"]

# Canonical reference prefix gating outbound **HTTP client-call** capture
# (S-348, CR-108, FR-WS-08) — the consumer-side twin of `framework_detectors`.
# FR-WS-08's normative PHP row is Guzzle. `use GuzzleHttp\Client;` canonicalises
# (backslash → `::`) to `GuzzleHttp::Client`, matched at the `::` segment
# boundary (`resolve::matches_detector`), so this row admits every
# `GuzzleHttp\...` namespace member (`Client`, `ClientInterface`,
# `Exception\RequestException`, …) without admitting an unrelated `Guzzle`-
# prefixed name.
#
# A file that only constructs Guzzle via a fully-qualified `new
# \GuzzleHttp\Client()` with no `use` clause carries no `@ref.import` at all —
# `references.scm` deliberately does not capture `new` construction (see its
# header) — so that file's ledger never opens this gate. A stated ceiling
# inherited from the references arm, not invented here.
http_client_detectors = ["GuzzleHttp"]

# A PHP file's module identity is the namespace it DECLARES, not its path
# (S-518, CR-170, FR-RS-13): its `symbols` query captures the declaration's name
# with `@module.namespace`, and each top-level type is named that namespace plus its
# own name (`resolve::package_key`). Imports bind through that fully-qualified
# name, so a namespace that differs from its directory still binds; a type
# declared twice under one name binds neither (NFR-RA-05). No `family` is
# declared, so the language is its own interop family (S-519): its imports reach
# only its own types and namespaces.
#
# A top-level `function` is a member of the namespace its file declares
# (S-551, FR-RS-26): a call from that namespace reaches it, and so does a
# `use function` import. A file declaring no namespace is in the global one,
# so its bare call binds the exactly-one function another such file declares —
# mantisbt's `gpc_get_int` — under every binding policy. A namespaced file's
# bare call its namespace declares no function for falls back to the global
# function, as PHP's does; a class name never falls back.
[module_model]
kind = "namespace"
top_level_callables = true
global_function_fallback = true

# Declared cross-file reach (S-570, CR-180, FR-PL-09): imports bind across
# files through the declared namespace (S-518), and so do a type's supertypes
# (S-522) and the class a `new Foo()` constructs (S-547); so does a static call
# on a class name (`Foo::bar()`, S-547), and a call on a receiver the file
# types (`Mailer $m`, `$m = new Mailer()`, a typed or promoted property read
# through `$this->`, S-552). A call on an untyped variable (`$other->run()`)
# binds in no file, which is why the level stays `partial`.
# Verified by `tests/reach_declared.rs`, which indexes a fixture and fails when a
# declared relation binds nothing across files or an undeclared one does — a
# change that alters this language's reach updates this table in the same change.
[reach]
level = "partial"
cross_file = ["calls", "imports", "type_relations"]

[queries]
symbols = "queries/symbols.scm"
references = "queries/references.scm"
frameworks = "queries/frameworks.scm"
# Outbound Guzzle HTTP client-call arm (S-348, CR-108, FR-WS-08): the
# verb-as-method-name form (`$client->get('/p')`) and the verb-as-first-argument
# form (`$client->request('GET', '/p')`, consuming the constructor-argument
# anchor shape Go/S-345 settled). Anchors only — the HTTP-verb and
# static-literal decisions stay in the generic dispatch and
# `resolve::http_client_call`. Its structural discriminators (an exactly-one-
# argument call on an instance receiver) keep a same-shaped route
# REGISTRATION — Slim's `$app->get('/x', $handler)` — from being read as an
# outbound call; see the query header.
invocations = "queries/invocations.scm"
# The names a callable body binds locally, each with its kind, scope and
# position (S-593, CR-191, FR-EX-33): facts only, read by no edge.
locals = "queries/locals.scm"
# Captured `@fw.route.method` text → HTTP method. Laravel's is the `Route::`
# facade verb (S-060): `Route::any` declares no single verb → ANY, and
# `resource`/`apiResource` have no row, so they promote nothing. Neither has
# `match`: its first argument is the verb list or a verb string, never the path,
# so a row would read `Route::match('get', '/x')` as a route at `/get` (S-549). Symfony's
# (S-549) is each string of a `#[Route]`'s `methods:` argument, written
# upper-case by convention (lower-case reuses Laravel's rows; `head` is there
# for Symfony alone), or the name of a `Request::METHOD_*` constant, or the
# attribute name `Route` itself when no verb is written — every verb, ANY. A captured
# verb with no entry here is dropped — the table doubles as the
# recognised-registration filter (FR-FW-04 best-effort).
[framework_methods]
get = "GET"
post = "POST"
put = "PUT"
patch = "PATCH"
delete = "DELETE"
options = "OPTIONS"
any = "ANY"
head = "HEAD"
GET = "GET"
POST = "POST"
PUT = "PUT"
PATCH = "PATCH"
DELETE = "DELETE"
OPTIONS = "OPTIONS"
HEAD = "HEAD"
METHOD_GET = "GET"
METHOD_POST = "POST"
METHOD_PUT = "PUT"
METHOD_PATCH = "PATCH"
METHOD_DELETE = "DELETE"
METHOD_OPTIONS = "OPTIONS"
METHOD_HEAD = "HEAD"
Route = "ANY"
