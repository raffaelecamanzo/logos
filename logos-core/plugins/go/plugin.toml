# Declarative descriptor for the Go grammar (S-015, FR-PL-01, FR-FW-03,
# ADR-09). Embedded via `include_str!` and parsed at startup by the
# LanguageRegistry. Droppable `.scm` query overrides resolve under
# `.logos/plugins/go/queries/` (FR-PL-04, UAT-PL-03).

name = "go"
extensions = ["go"]

# Go member access joins with a dot (`http.HandleFunc`). An import path is a
# different grammar — a PATH — declared separately (S-439, CR-142 D1): only `/`
# separates, so the dotted host in `"github.com/org/repo/internal/admin"` stays
# one segment. The binder resolves an intra-module path against the module's
# `go.mod`; Go import paths name directories, so no extension is stripped.
module_separator = "."
import_specifier = "path"

# tree-sitter-go 0.25 is generated against ABI 15.
abi_version = 15

# An unqualified call (`f()`) is never a call on a receiver in Go: a method is
# reached only through one (`s.f()`). Declared explicitly — not defaulted — so a
# bare call binds free functions only, never a method that merely shares its
# name (S-590, CR-189, FR-RS-07).
implicit_receiver = "none"

# Go writes no `implements` clause: a type implements an interface when its method
# set covers every method the interface declares (S-529, CR-172, FR-RS-18). The
# resolution pass records that `Implements` itself, matching methods by name and
# parameter count with embedded fields' methods promoted and embedded interfaces
# expanded; a generic interface is reported not computed.
method_set_implements = true

# `brokers` captures message-broker publish/subscribe sites (S-408, FR-WS-10,
# ADR-54). Go's arm is the receiver-gated Kafka Streams topology form only —
# `queries/brokers.scm` records why the Rust file's bare-verb patterns were
# deliberately not ported, and which half of the arm the reference estate
# measures: capture is fixture-only, over-capture is 0 rows over its 262 real
# `.go` files.
capabilities = ["symbols", "references", "frameworks", "invocations", "brokers", "locals"]

# Decision-point tokens for the cyclomatic-complexity keyword walk (FR-EX-03).
# `case` covers both switch and select arms.
complexity_keywords = ["if", "else", "for", "case", "&&", "||"]

# Block-structure nesting node kinds for per-function max nesting depth
# (CR-005, FR-EX-07): the Go control-flow statements (both switch forms and
# select). Depth 0 is a flat body; each nested statement adds one.
nesting_block_kinds = ["if_statement", "for_statement", "expression_switch_statement", "type_switch_statement", "select_statement"]

# Callable body node kinds for the has-body fact (S-500, CR-163, FR-EX-11, S-525):
# a Function/Method is implemented when its declaration has a direct `block` child.
# An interface's method spec (`Check(e int) bool`) is a Method with none, so it is
# bodyless; every `func` with a body keeps its body, its tokens and its metrics.
body_node_kinds = ["block"]

# Go's export rule is the language's capitalisation convention: a
# leading-uppercase name is exported (FR-AN-01).
export_convention = "capitalized"

# How Go marks a function as a test (S-027, FR-EX-06, ADR-18): a `Test`/
# `Benchmark`/`Fuzz`/`Example` function defined in a `*_test.go` file (the
# filename gate `go test` itself uses). Feeds the unified `is_test` annotation
# (S-028).
test_convention = "go-test-func"

# The functions the Go runtime calls itself (S-530, FR-AN-01): a package's
# `main` and its `init` functions have no caller in source, so each is a
# dead-code live root in a `.go` file — and only there: a Rust `fn init` stays
# an ordinary function.
entry_points = ["main", "init"]

# Go does NOT declare `reachability` (S-530, CR-172, ADR-39): its callables keep
# `is_dead = NULL`. With the roots above and `reachability = true` set for the
# measurement, zap @ 4892335e reported 12 dead of 1,190 functions and methods
# and ollama @ 42e911bc 737 of 9,360. Re-judged against the source, a sample of
# 30 (zap's 12, 18 of ollama's drawn at random) held 30 live, where the bar to
# declare is at most 2. The first missing link: 10 a call on a typed receiver
# (`b.pool.put(b)`, `go s.start()`), 6 a function or method value
# (`sr.newFileSinkFromURL`, a map of constructors), 2 a function declared once per
# build tag, and 12 a caller itself falsely dead. Declare it only after those
# shapes bind and a fresh sample passes.

# The ratified v1 Go framework set (FR-FW-03): net/http + Gin. Canonical
# `::`-joined prefixes of the import paths ("net/http",
# "github.com/gin-gonic/gin") — path-grammar canonical, so the host keeps its
# dot (S-439).
framework_detectors = ["net::http", "github.com::gin-gonic::gin"]

# Canonical reference prefixes whose presence in a file's ledger makes the file
# an outbound **HTTP client-call** candidate (S-345, CR-108, FR-WS-08) — the
# consumer-side twin of `framework_detectors`. `net/http` is the whole of
# FR-WS-08's normative Go row: the stdlib client, no third party.
#
# The import canonicalises to the ledger target `net::http`, and the detector is
# matched at a SEGMENT BOUNDARY (`resolve::matches_detector`), so this row admits
# `net::http` and `net::http::httptest` while excluding the sibling `net::url` /
# `net::mail` packages. Naming the root `net` instead would make any `net/url`
# importer a candidate.
#
# This row is a cheap PRE-FILTER, not the whole of FR-WS-08 negative case 1.
# Since S-402 (CR-126) the decision that separates `cache.Get("/admin/users")`
# from a genuine client call is made on the RECEIVER, in
# `queries/invocations.scm` — read its "Candidacy" header before changing either.
# A file-grained gate cannot answer a question about a CALL; the query header
# carries the measurement that established it (NFR-RA-05).
http_client_detectors = ["net::http"]

# A Go package is a directory: every file in it that declares the same `package`
# clause shares one scope (S-528, CR-172, FR-RS-17). The path model's keys are
# unchanged; `directory_packages` records each file's clause (`queries/symbols.scm`
# captures it as `@package.name`) and lets a bare name its own file does not
# declare bind to the exactly-one top-level declaration of that name among the
# package's other files. A name declared twice (build-tag variants) stays
# unbound, and a `package foo_test` file is a package of its own.
[module_model]
kind = "path"
directory_packages = true

# Declared cross-file reach (S-570, CR-180, FR-PL-09): some relations bind
# across files, not all.
# Verified by `tests/reach_declared.rs`, which indexes a fixture and fails when a
# declared relation binds nothing across files or an undeclared one does — a
# change that alters this language's reach updates this table in the same change.
# A type implementing an interface of another file or package, and a method
# reading a field of its receiver's struct declared in another file of the
# package, bind across files since S-529.
[reach]
level = "partial"
cross_file = ["calls", "imports", "type_relations", "member_access"]

[queries]
symbols = "queries/symbols.scm"
references = "queries/references.scm"
frameworks = "queries/frameworks.scm"
# Outbound `net/http` client-call arm (S-345, CR-108, FR-WS-08): the
# verb-as-method-name forms (`http.Get`, `http.Post`) and the
# verb-as-constructor-argument form (`http.NewRequest("GET", …)`). A
# receiver-NAME boundary rule makes candidacy receiver-grained (S-402, CR-126),
# and two argument-shape discriminators keep a route REGISTRATION — syntactically
# the same shape — from being read as an outbound call; see the query header.
invocations = "queries/invocations.scm"
# Receiver-gated Kafka Streams topology links (S-408, CR-131 §3.2 A1):
# `Stream(<topic>)` a subscribe, `To(<topic>)` a publish, each admitted only when
# `extract::broker::receiver_is_topology` resolves the receiver to a
# `StreamsBuilder`/`KStream` binding the same file declares.
brokers = "queries/brokers.scm"
# The names a callable body binds locally, each with its kind, scope and
# position (S-593, CR-191, FR-EX-33): facts only, read by no edge.
locals = "queries/locals.scm"
# Captured `@fw.route.method` text → HTTP method (S-015). Gin's router verbs
# name themselves; net/http registrations (`HandleFunc`/`Handle`) and Gin's
# `Any` carry no single verb.
[framework_methods]
GET = "GET"
POST = "POST"
PUT = "PUT"
DELETE = "DELETE"
PATCH = "PATCH"
HEAD = "HEAD"
OPTIONS = "OPTIONS"
Any = "ANY"
HandleFunc = "ANY"
Handle = "ANY"
