# Declarative descriptor for the Java grammar (S-015, FR-PL-01, FR-FW-03,
# ADR-09). Embedded via `include_str!` and parsed at startup by the
# LanguageRegistry. Droppable `.scm` query overrides resolve under
# `.logos/plugins/java/queries/` (FR-PL-04, UAT-PL-03).

name = "java"
extensions = ["java"]

# Java joins package/member segments with a dot — reference extraction
# canonicalises dotted paths into the `::`-joined ledger form.
module_separator = "."

# tree-sitter-java 0.23 is generated against ABI 14.
abi_version = 14

capabilities = ["symbols", "references", "frameworks", "invocations", "brokers", "properties"]

# Decision-point tokens for the cyclomatic-complexity keyword walk (FR-EX-03).
complexity_keywords = ["if", "else", "for", "while", "do", "case", "catch", "&&", "||", "?"]

# Block-structure nesting node kinds for per-function max nesting depth
# (CR-005, FR-EX-07): the Java control-flow statements. Depth 0 is a flat body;
# each nested statement adds one.
nesting_block_kinds = ["if_statement", "for_statement", "enhanced_for_statement", "while_statement", "do_statement", "switch_expression", "try_statement", "try_with_resources_statement"]

# Java's export rule: a `public` token inside the declaration's `modifiers`
# (FR-AN-01 — package-private and stricter are non-roots).
export_convention = "public-modifier"

# How Java marks a method as a test (S-027, FR-EX-06, ADR-18): a `@Test`-family
# annotation (`@Test`, `@ParameterizedTest`, `@RepeatedTest`, …) in the method's
# `modifiers`. Feeds the unified `is_test` annotation (S-028).
test_convention = "java-annotations"

# The ratified v1 Java framework set (FR-FW-03): Spring (MVC/Boot) — one
# package prefix covers both.
framework_detectors = ["org::springframework"]

# Canonical reference prefixes whose presence in a file's ledger makes the file
# an outbound **HTTP client-call** candidate (S-341, CR-108, FR-WS-08) — the
# consumer-side twin of `framework_detectors`. FR-WS-08's normative Java row is
# RestClient, WebClient, RestTemplate and `java.net.http.HttpClient`. All three
# rows are genuine import package prefixes, so the gate stays independent of the
# calls this arm itself captures (see `extract::capture_http_client_call_arm` for
# the general rule this row does NOT need the compensating scope for). Named at
# package-prefix grain on purpose — `org::springframework` alone would admit
# every Spring file and `java` alone every Java file (NFR-RA-05).
#
# This row is a file-level PRE-FILTER, not the arm's whole gate:
# `queries/invocations.scm`'s plain receiver-method patterns carry a
# receiver-name rule of their own (S-375, CR-120). The general rule — why a
# file-grained gate cannot answer FR-WS-08 AC5's per-CALL question, and what an
# arm shipping the broad anchor therefore owes — is stated once on
# `extract::capture_http_client_call_arm`; the vocabulary and its test pins are
# in that query's own "receiver rule" section. The one fact local to this row:
# widening it does not substitute for that rule, and narrowing it would not
# tighten it.
http_client_detectors = [
  # `RestClient` and `RestTemplate`.
  "org::springframework::web::client",
  # `WebClient` (spring-webflux).
  "org::springframework::web::reactive::function::client",
  # `HttpClient` / `HttpRequest` / `HttpResponse` (JDK 11+).
  "java::net::http",
]

[queries]
symbols = "queries/symbols.scm"
references = "queries/references.scm"
frameworks = "queries/frameworks.scm"
# Message-broker publish/subscribe invocation arm (S-254, FR-WS-10): Spring
# Kafka/Rabbit/JMS listener annotations and template sends, keyed by topic.
brokers = "queries/brokers.scm"
# Outbound HTTP client-call arm (S-341, CR-108, FR-WS-08): RestClient/WebClient
# fluent chains, the `java.net.http.HttpClient` builder, and the plain
# receiver-method idiom — the last one scoped to a client receiver (S-375).
# Anchors only — the HTTP-verb and static-literal decisions stay in the generic
# dispatch and `resolve::http_client_call`.
invocations = "queries/invocations.scm"
# Configuration-binding capture (S-381, CR-121, FR-WS-19): the
# `@ConfigurationProperties` class, its key prefix and the properties it
# declares. Anchors only — which annotation binds, and how a use site spells a
# read, are the `[properties]` table below.
properties = "queries/properties.scm"
# Captured `@fw.route.method` annotation name → HTTP method (S-015).
# `@RequestMapping` declares no single verb.
[framework_methods]
GetMapping = "GET"
PostMapping = "POST"
PutMapping = "PUT"
DeleteMapping = "DELETE"
PatchMapping = "PATCH"
RequestMapping = "ANY"

# The configuration-BINDING vocabulary (S-381, CR-121, FR-WS-19, FR-PL-02) —
# the descriptor half of the `properties` capability, paired with
# `queries/properties.scm`. Together they are the whole per-language surface:
# `logos-core`'s interpreter reads capture names and these rows and nothing
# else, which is the claim S-381 AC2 turns on (NFR-MA-01).
[properties]
# The annotation that marks a class as configuration-bound, compared EXACTLY
# against the `@props.annotation` capture's text. One row, because Spring Boot
# spells this exactly one way. `@EnableConfigurationProperties` is deliberately
# absent: it registers a bound class, it does not declare one, and it carries no
# prefix — admitting it would key every registration site to the empty prefix.
#
# The vocabulary lives HERE rather than in the query's own `#eq?` so there is
# exactly one copy of it; the query file's header states why.
annotations = ["ConfigurationProperties"]
# How a Java use site names one property: the bean-getter convention. Both
# prefixes are tried and the survivors are intersected with what the class
# declares, so table ORDER decides nothing — but neither of these two is a
# prefix of the other, so at most one can ever strip a given name and the
# ambiguity refusal is unreachable for Java. (It is reachable for a language
# that also reads properties directly; Kotlin's descriptor is the worked
# example.)
accessor_prefixes = ["get", "is"]
