# Declarative descriptor for the Kotlin grammar (S-055, CR-009, FR-PL-07,
# FR-FW-03, ADR-09). Embedded via `include_str!` and parsed at startup by the
# LanguageRegistry. Droppable `.scm` query overrides resolve under
# `.logos/plugins/kotlin/queries/` (FR-PL-04, UAT-PL-03).
#
# Kotlin is pure plugin data over the existing substrate: this descriptor + its
# four queries + one cargo feature + one `grammars.rs` row, no extraction or
# resolution logic change (NFR-MA-01). The one bounded exception is the
# `kotlin-annotations` test convention — Kotlin's annotation node carries no
# `name` field, so the Java annotation reader cannot detect `@Test`; per the
# manifest's own "one new variant" contract it ships a `TestConvention` variant
# (see manifest.rs / extract::testmarker). Six of CR-009's seven languages hit
# this same wall — a sprint-review coherence item.

name = "kotlin"
extensions = ["kt", "kts"]

# Kotlin joins package/member segments with a dot — reference extraction
# canonicalises dotted paths into the `::`-joined ledger form.
module_separator = "."

# tree-sitter-kotlin-ng 1.1 is generated against ABI 14.
abi_version = 14

capabilities = ["symbols", "references", "frameworks", "invocations", "properties", "locals"]

# The optional member-access capability (S-562, CR-178, FR-EX-25, FR-QM-11,
# ADR-39): Cohesion scores a class only in a language that declares it. Kotlin's
# queries capture `this.x` and the bare forms — `count + x`, `repo.find(id)`,
# `"${name}"` — as `Accesses` edges (`queries/references.scm`, `@ref.access` and
# `@ref.access.bare`), and a class's primary-constructor `val`s are its
# properties (`queries/symbols.scm`), so its classes' LCOM4 has its shared-field
# links. Stated ceilings: a property a class inherits or an outer class declares
# adds no link; a name any local of the method declares hides the property in
# the whole method; the bodies of an `object : T { … }` and of an extension
# function, and the trailing lambda of `x.apply { }`, `x.run { }` and
# `with(x) { }`, are not read (any other receiver lambda is: a `T.() -> R`
# parameter or builder DSL may name a receiver's property as the class's); a
# `this.x` inside one of those bodies is still read, as a labelled `this@A.x` is
# not; a property initialiser, `init` block and accessor are no method; a bare
# call of a function-typed property (`onDone()`) is the call; a short `"$name"`
# interpolation is string text to the grammar.
member_access = true

# How an unqualified call is read (S-516, CR-169, FR-RS-12): a bare `m()` inside
# a class, interface or object is a call on the current instance — recorded with the
# `self` receiver shape and bound among that type's own members only, never
# to a same-named top-level function — unless the file shows no member can
# answer it (S-560: the class declares no `m` and inherits nothing, and the
# file binds no value `m`), when it is the free call. Outside one it is a free
# call, bound by the lexical scope, the imports and the package
# (`queries/references.scm`, `@ref.receiver.implicit`, `@ref.implicit.*`).
implicit_receiver = "self"

# Callables overload by name (S-592, FR-RS-43): a bare call binds only a
# callable whose parameter range admits its argument count, and a scope whose
# same-named callables admit none is passed over. Same-arity overloads stay
# `overload-ambiguous`: no argument type is read.
overloaded_calls = true

# Kotlin's resolution tries each scope level for an applicable candidate: an
# unqualified in-class call that no member of the class or its supertypes
# admits goes on to the top-level functions and imports in scope (S-592,
# FR-RS-43). C#, Java, Scala and C++ stop at the member that hides the name. A
# bare call no member of its class can hold — the file shows the class declares
# none of the name and inherits nothing — is the free call itself (S-560,
# `queries/references.scm`'s `@ref.implicit.*` marks).
implicit_call_falls_through = true
# Every class inherits `Any`'s members, which the graph never holds: a call of
# one of these names may be `Any`'s, which a member beats a top-level function
# to, so it never falls through.
implicit_root_members = ["equals", "hashCode", "toString"]

# Calling a class constructs it (S-521, CR-170, FR-RS-16): a free `Foo()` whose
# one candidate is a class records `Instantiates` to that class. A top-level
# factory function and a class of one name are two candidates, and stay unbound.
# A bare `Foo()` inside a class is a call on the current instance (above), so it
# binds among that type's members and never reaches the class — unless it is the
# free call, in a class that declares no `Foo` and inherits nothing (S-560).
class_call_instantiates = true

# A supertype's kind follows the type it binds (S-522, CR-170, FR-RS-15): the
# list after `:` holds the base class and the interfaces alike (`class A :
# Base(), Iface`), so each entry is captured once and its edge is `Extends` to
# the class it binds, `Implements` to an interface. An interface's own
# supertypes are interfaces, and are `Extends`.
supertype_kind_follows_target = true

# A class inherits the bodies of the interface members it implements (S-609,
# FR-RS-48): a call no class of the supertype list's chain answers goes on to
# the interfaces the chain implements, then their super-interfaces — class
# before interface. Only an interface `fun` with a body is a candidate there:
# an abstract one records no body, and a `private` one is marked
# `@item.uninherited` (`queries/symbols.scm`).
inherits_interface_bodies = true

# Decision-point tokens for the cyclomatic-complexity keyword walk (FR-EX-03).
# Kotlin's anonymous control-flow/operator tokens: `when` replaces `switch`
# (counted once per expression, the keyword-walk approximation), `?:` is the
# Elvis operator. Matched as anonymous token-node kinds, never as source text.
complexity_keywords = ["if", "else", "for", "while", "do", "when", "catch", "&&", "||", "?:"]

# Block-structure nesting node kinds for per-function max nesting depth
# (CR-005, FR-EX-07): Kotlin models `if`/`when`/`try` as *expressions*. Depth 0
# is a flat body; each nested control-flow construct adds one.
nesting_block_kinds = ["if_expression", "for_statement", "while_statement", "do_while_statement", "when_expression", "try_expression"]

# Callable body node kinds for the has-body fact (S-500, CR-163, FR-EX-11): a
# Function/Method is implemented when its declaration is, or has a direct
# child of, one of these kinds — the `function_body` (`{ … }` or `= expr`). An `abstract` member and an
# interface function with no default carry none.
body_node_kinds = ["function_body"]

# Kotlin's export rule: public-by-default (FR-AN-01). Declarations are exported
# unless an explicit `private`/`internal`/`protected` visibility modifier
# narrows them; `All` is the safe under-reporting direction (AR-05) and the
# documented best-effort posture (CR-009 binding table) — precise visibility
# narrowing is deferrable future work.
export_convention = "all"

# How Kotlin marks a function as a test (S-055, FR-EX-06, ADR-18): a `@Test`-
# family annotation (`@Test`, `@ParameterizedTest`, `@RepeatedTest`, …) covering
# both JUnit (`org.junit.jupiter.api.Test`) and `kotlin.test.Test`. Feeds the
# unified `is_test` annotation (S-028).
test_convention = "kotlin-annotations"

# The ratified v1 JVM framework set (FR-FW-03): Spring (MVC/Boot) — one package
# prefix covers both, reused verbatim from the Java detector — and Ktor (S-561),
# whose `routing { }` DSL is Kotlin's own.
framework_detectors = ["org::springframework", "io::ktor"]

# Canonical reference prefixes gating outbound **HTTP client-call** capture
# (S-342, CR-108, FR-WS-08): FR-WS-08's normative Kotlin row is the same JVM
# client set Java binds — RestClient, WebClient, RestTemplate and
# `java.net.http.HttpClient` — so the rows are the Java plugin's verbatim, and
# deliberately so: two languages compiling against the same JARs must gate on
# the same packages or the same source would be a client call in one and not in
# the other.
#
# Kotlin's `import org.springframework.web.client.RestClient` canonicalises to
# the ledger target `org::springframework::web::client::RestClient` exactly as
# Java's does (`module_separator = "."`, `references.scm`'s `@ref.import`), and
# `resolve::matches_detector` matches at a `::` SEGMENT BOUNDARY. So these rows
# admit the client packages while excluding their siblings — notably
# `org::springframework::boot::test::web::client::TestRestTemplate`, which is
# NOT under `org::springframework::web::client`.
#
# Named at package-prefix grain on purpose: `org::springframework` alone would
# admit every Spring file and `java` alone every Kotlin file using the JDK,
# which is exactly the over-capture this gate exists to prevent (NFR-RA-05).
# Every row is multi-segment, never a bare identifier, so the gate is
# independent evidence rather than something the call shape itself can supply
# (see the `capture_http_client_call_arm` rustdoc for that rule).
http_client_detectors = [
  # `RestClient` and `RestTemplate`.
  "org::springframework::web::client",
  # `WebClient` (spring-webflux).
  "org::springframework::web::reactive::function::client",
  # `HttpClient` / `HttpRequest` / `HttpResponse` (JDK 11+).
  "java::net::http",
]

# A Kotlin file's module identity is the package it DECLARES, not its path
# (S-518, CR-170, FR-RS-13) — replacing the `src/{main,test}/kotlin` source-root
# keying S-472 gave it, under which the 91% of a Multiplatform or Android
# repository that sits in `commonMain`, `jvmMain` or `src/main/java` never bound.
# Its `symbols` query captures the `package` header with `@module.namespace`, and
# each top-level type is named that package plus its own name
# (`resolve::package_key`), which is also how the declared-type facts name it. A
# type declared twice under one name — a `main` and a `test` declaration — binds
# neither (NFR-RA-05).
# `family = "jvm"` (S-519, NFR-RA-05): Java, Kotlin and Scala name each other's
# types, so they share one interop family — the fully-qualified type index and
# the namespace-files index reach only targets of the source's own family, and a
# C# `using` never binds a PHP namespace of the same spelling.
# A top-level `fun` is a member of its file's package (S-560, FR-RS-31), as the
# package's types are: an import names it, `import a.b.*` brings it into view,
# and a call from the same package reaches it.
# An extension `fun String.toSlug()` is callable on a value (S-560): its
# receiver type is its `@symbol.self_type` (`queries/symbols.scm`), and a
# receiver call `title.toSlug()` binds the one extension of the name the file
# imports, its package declares or a wildcard brings into view. Where no
# receiver type is proven, a member of the name on any class of the family may
# be the one called, and keeps the call unbound.
# A receiver whose one binding in scope proves its type `T` (S-563, FR-RS-32;
# `queries/references.scm`, "Receiver typing") — a class, object or companion
# property, a constructor `val`/`var`, a parameter, a typed local, lambda,
# `for`, `catch` or `when` variable, `val x = T()` — is recorded `T::find`
# with the `other` shape: bound among `T`'s own members up its proven
# supertypes, never among its companion's, which the written `T.find()`
# reaches first because this descriptor declares `companion_name`; and, where
# no level of `T` answers, to the extension as an untyped call is.
# Java reaches a file's top-level functions through its facade class (S-560):
# `Utils.kt`'s `f` is `UtilsKt.f()` to Java. Kotlin itself never names it.
# A `companion object` is a node of its own, `C#Companion#` (S-559), and its
# members are reached through its class (I4-INT): `C.make()` binds among the
# companion's callables alone, and a bare `make()` inside `C` reaches them once
# `C` and its supertypes hold no applicable `make`, then its superclasses'
# companions. Only the anonymous companion's name is known; a `companion object
# Factory` is read as a nested `object`, reached through `C.Factory`.
[module_model]
kind = "namespace"
family = "jvm"
top_level_callables = true
extension_functions = true
file_facade = "Kt"
companion_name = "Companion"

# Declared cross-file reach (S-570, CR-180, FR-PL-09): imports bind across
# files through the declared package (S-518). A call to a top-level `fun` or an
# extension through an import, a wildcard or the package, a call on a class or
# object (`Ticket.empty()`), and a bare call no member of its class answers bind
# across files (S-560), and so does a call on a receiver whose type the file
# proves (S-563); a call on any other receiver binds only through the caller's
# own class. Of the type relations, the `Instantiates` a top-level
# `Foo()` records binds across files (S-521), and so does a type's supertype
# (S-522).
# Verified by `tests/reach_declared.rs`, which indexes a fixture and fails when a
# declared relation binds nothing across files or an undeclared one does — a
# change that alters this language's reach updates this table in the same change.
[reach]
level = "partial"
cross_file = ["calls", "imports", "type_relations"]

[queries]
symbols = "queries/symbols.scm"
references = "queries/references.scm"
frameworks = "queries/frameworks.scm"
# Outbound HTTP client-call arm (S-342, CR-108, FR-WS-08): the RestClient/
# WebClient fluent chain, the `java.net.http.HttpClient` builder in both orders,
# and the plain receiver-method idiom (positional and named-argument forms).
# Anchors only — the HTTP-verb and static-literal decisions stay in the generic
# dispatch and `resolve::http_client_call`. Its receiver, argument-arity and
# call-position rules keep a route REGISTRATION — syntactically the same shape,
# and in Kotlin routinely written with a trailing lambda — from being read as an
# outbound call; see the query header.
invocations = "queries/invocations.scm"
# Configuration-binding capture (S-381, CR-121, FR-WS-19): the annotated class,
# its key prefix and the properties it declares — the second language on the
# binding substrate, and the demonstration that adding one costs no
# `logos-core` edit (S-381 AC2).
properties = "queries/properties.scm"
# The names a callable body binds locally, each with its kind, scope and
# position (S-593, CR-191, FR-EX-33): facts only, read by no edge.
locals = "queries/locals.scm"
# Captured `@fw.route.method` annotation name → HTTP method (S-055), identical
# to the Java Spring mapping. `@RequestMapping` declares no single verb. The
# `GET`/`POST`… rows are Spring's functional DSL and the `get`/`post`… rows
# Ktor's routing DSL (S-561): the call names themselves, each a registration
# only inside a router block (`queries/frameworks.scm`).
[framework_methods]
GetMapping = "GET"
PostMapping = "POST"
PutMapping = "PUT"
DeleteMapping = "DELETE"
PatchMapping = "PATCH"
RequestMapping = "ANY"
GET = "GET"
POST = "POST"
PUT = "PUT"
DELETE = "DELETE"
PATCH = "PATCH"
HEAD = "HEAD"
OPTIONS = "OPTIONS"
get = "GET"
post = "POST"
put = "PUT"
delete = "DELETE"
patch = "PATCH"
head = "HEAD"
options = "OPTIONS"

# The configuration-BINDING vocabulary (S-381, CR-121, FR-WS-19, FR-PL-02).
# Kotlin's Spring binding is annotation-compatible with Java's, so the
# vocabulary row is the same — what differs is everything structural, which is
# why the second language needed a query file (see `queries/properties.scm`) and
# nothing else.
[properties]
annotations = ["ConfigurationProperties"]
# Kotlin reads a property BOTH ways, and both are rows here:
#
#   * `""` — direct property access, Kotlin's own convention: the accessor name
#     already IS the property (`config.uriGetArchive`). This is the row Java
#     cannot have, and the one that proves the accessor convention is descriptor
#     data rather than a core assumption about bean getters.
#   * `get` / `is` — the JVM-interop getters a Java call site sees on the same
#     class (`config.getUriGetArchive()`).
#
# Every row is tried and the survivors are intersected with what the class
# declares, so order decides nothing. Unlike Java's two rows, these three DO
# overlap — a class declaring both `url` and `getUrl` makes `getUrl` match two
# declared properties — and such a site binds NOTHING rather than picking one
# (`BindingRefusal::AmbiguousProperty`, S-381 AC4).
accessor_prefixes = ["", "get", "is"]
