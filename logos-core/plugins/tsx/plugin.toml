# Declarative descriptor for the TSX grammar (S-015, FR-PL-01, FR-FW-03,
# ADR-09): `.tsx`/`.jsx` sources. JSX changes the syntax, so tree-sitter ships
# TSX as a distinct Language from the same crate — this plugin pairs it with
# its own queries (identical vocabulary to the `typescript` plugin; kept as a
# separate asset dir so each grammar's queries compile against its own
# Language). Droppable `.scm` query overrides resolve under
# `.logos/plugins/tsx/queries/` (FR-PL-04, UAT-PL-03).

name = "tsx"
extensions = ["tsx", "jsx"]

# Member paths join with a dot (`a.b.c`). An import specifier is a different
# grammar — a PATH — and is declared separately (S-439, CR-142 D1): only `/`
# separates, a relative specifier resolves against the importing file, and a
# trailing extension below is stripped so `"./nav.ts"` and `"./nav"` name the
# same file. Both TS grammars declare the pair identically (ADR-09); an
# extension not listed (`"./styles.css"`) is kept and so never reads as code.
module_separator = "."
import_specifier = "path"
specifier_extensions = ["ts", "tsx", "js", "jsx", "mjs", "cjs"]

# tree-sitter-typescript 0.23 (TSX Language) is generated against ABI 14.
abi_version = 14

# An unqualified call (`m()`) is never a call on the current instance in
# TS/JS: it is a free call, bound by scope (S-515, CR-169). Declared, not
# defaulted, so the choice is visible beside the receiver markers in
# `references.scm`.
implicit_receiver = "none"

# JavaScript enforces no arity (S-592, FR-RS-43; Sprint 91 Autonomous Decision
# 3): a JS call may pass any number of arguments to any function, so a call in
# one of these files is never filtered by a parameter range. `.ts` calls are.
arity_unchecked_extensions = ["jsx"]

capabilities = ["symbols", "references", "frameworks", "invocations"]

complexity_keywords = ["if", "else", "for", "while", "do", "case", "catch", "&&", "||", "?"]

# Block-structure nesting node kinds for per-function max nesting depth
# (CR-005, FR-EX-07): identical to the typescript plugin's set (same grammar
# vocabulary, distinct TSX Language).
nesting_block_kinds = ["if_statement", "for_statement", "for_in_statement", "while_statement", "do_statement", "switch_statement", "try_statement"]

# Callable body node kinds for the has-body fact (S-500, CR-163, FR-EX-11): a
# Function/Method is implemented when its declaration is, or has a direct
# child of, one of these kinds — a function/method `statement_block`, or the `arrow_function`/
# `function_expression` a `const f = …` declarator binds. Overload signatures,
# `abstract` and interface method signatures are separate node kinds
# (`function_signature`, `method_signature`, …) the symbols query does not
# capture, so no bodyless callable reaches the graph from them.
body_node_kinds = ["statement_block", "arrow_function", "function_expression"]

export_convention = "export-statement"

# How TS/JS marks a function as a test (S-027, FR-EX-06, ADR-18): a function
# lexically enclosed by an `it`/`test`/`describe` call. Feeds the unified
# `is_test` annotation (S-028).
test_convention = "js-callback"

# The ratified v1 TypeScript/JS framework set (FR-FW-03): Express + Next.js;
# a Next.js component file may import only react.
framework_detectors = ["express", "next", "react"]

# Canonical reference prefixes gating outbound **HTTP client-call** capture
# (S-343, CR-108, FR-WS-08). Identical to the `typescript` plugin's row, and for
# the same reason its queries are identical: `.ts`/`.js` and `.tsx`/`.jsx` are
# one language split across two tree-sitter `Language`s (ADR-09), so a row landed
# in one and not the other leaves half the TypeScript surface ungated.
#
# NON-INDEPENDENT GATE: `fetch` is one. The general rule is stated once on
# `extract::capture_http_client_call_arm`; the TS-specific half (why `fetch` is
# tautological and `axios` is not) is on the `typescript` descriptor's row. The
# compensating scope that rule obliges is delivered by
# `queries/invocations.scm`, whose patterns are all anchored to a named client.
http_client_detectors = ["axios", "fetch"]

# Declared cross-file reach (S-570, CR-180, FR-PL-09): some relations bind
# across files, not all.
# Verified by `tests/reach_declared.rs`, which indexes a fixture and fails when a
# declared relation binds nothing across files or an undeclared one does — a
# change that alters this language's reach updates this table in the same change.
[reach]
level = "partial"
cross_file = ["calls", "imports"]

[queries]
symbols = "queries/symbols.scm"
references = "queries/references.scm"
frameworks = "queries/frameworks.scm"
# Outbound HTTP client-call arm (S-343, CR-108, FR-WS-08): byte-identical
# patterns to the `typescript` plugin's, compiled against the TSX `Language`.
invocations = "queries/invocations.scm"
[framework_methods]
get = "GET"
post = "POST"
put = "PUT"
delete = "DELETE"
patch = "PATCH"
head = "HEAD"
options = "OPTIONS"
all = "ANY"
use = "ANY"
