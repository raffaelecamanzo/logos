# Declarative descriptor for the TypeScript grammar (S-015, FR-PL-01,
# FR-FW-03, ADR-09): `.ts`/`.js` sources. JSX-bearing files (`.tsx`/`.jsx`)
# parse with the sibling `tsx` plugin — a distinct tree-sitter Language from
# the same crate/feature. Droppable `.scm` query overrides resolve under
# `.logos/plugins/typescript/queries/` (FR-PL-04, UAT-PL-03).

name = "typescript"
extensions = ["ts", "js", "mjs", "cjs"]

# Member paths join with a dot (`a.b.c`). An import specifier is a different
# grammar — a PATH — and is declared separately (S-439, CR-142 D1): only `/`
# separates, a relative specifier resolves against the importing file, and a
# trailing extension below is stripped so `"./nav.ts"` and `"./nav"` name the
# same file. Both TS grammars declare the pair identically (ADR-09); an
# extension not listed (`"./styles.css"`) is kept and so never reads as code.
module_separator = "."
import_specifier = "path"
specifier_extensions = ["ts", "tsx", "js", "jsx", "mjs", "cjs"]

# tree-sitter-typescript 0.23 is generated against ABI 14; asserted at load
# against the compiled grammar (FR-PL-03, NFR-PC-03).
abi_version = 14

capabilities = ["symbols", "references", "frameworks", "invocations"]

# Decision-point tokens for the cyclomatic-complexity keyword walk (FR-EX-03).
complexity_keywords = ["if", "else", "for", "while", "do", "case", "catch", "&&", "||", "?"]

# Block-structure nesting node kinds for per-function max nesting depth
# (CR-005, FR-EX-07): the TS/JS control-flow statements. Depth 0 is a flat body;
# each nested statement adds one.
nesting_block_kinds = ["if_statement", "for_statement", "for_in_statement", "while_statement", "do_statement", "switch_statement", "try_statement"]

# Callable body node kinds for the has-body fact (S-500, CR-163, FR-EX-11): a
# Function/Method is implemented when its declaration is, or has a direct
# child of, one of these kinds — a function/method `statement_block`, or the `arrow_function`/
# `function_expression` a `const f = …` declarator binds. Overload signatures,
# `abstract` and interface method signatures are separate node kinds
# (`function_signature`, `method_signature`, …) the symbols query does not
# capture, so no bodyless callable reaches the graph from them.
body_node_kinds = ["statement_block", "arrow_function", "function_expression"]

# TS/JS exports are structural: a declaration under an `export_statement`
# ancestor is an exported dead-code root (FR-AN-01).
export_convention = "export-statement"

# How TS/JS marks a function as a test (S-027, FR-EX-06, ADR-18): a function
# lexically enclosed by an `it`/`test`/`describe` call. Feeds the unified
# `is_test` annotation (S-028).
test_convention = "js-callback"

# The ratified v1 TypeScript/JS framework set (FR-FW-03): Express + Next.js
# (`react` rides along: a Next.js component file may import only react).
framework_detectors = ["express", "next", "react"]

# Canonical reference prefixes whose presence in a file's ledger makes the file
# an outbound **HTTP client-call** candidate (S-343, CR-108, FR-WS-08) — the
# consumer-side twin of `framework_detectors`. FR-WS-08's normative TypeScript
# row is `axios` and the `fetch` global.
#
# NON-INDEPENDENT GATE — `fetch` is one. The general rule, and what a language
# owes when it declares such a row, is stated once on
# `extract::capture_http_client_call_arm`; read it before copying this row's
# shape. What is TS-specific, and belongs here:
#
#   * `fetch` is a *global*, imported from nothing, so the ledger evidence that
#     opens the gate is the `@ref.call` on the `fetch` identifier itself. For
#     that half the gate is tautological — a file declaring its own local
#     `fetch` self-satisfies it — and only `queries/invocations.scm`'s
#     exact-name guard, the leading-`/` requirement and `route_key` stand
#     behind it.
#   * `axios` is a genuine import specifier and gates normally.
#
# The compensating scope that rule obliges IS delivered here: every pattern in
# `queries/invocations.scm` is anchored to a NAMED client, and this language
# ships no broad `<receiver>.<method>(<arg>)` anchor.
#
# Both TS grammars share the row: `.ts`/`.js` and `.tsx`/`.jsx` are one language
# split across two tree-sitter `Language`s (ADR-09).
http_client_detectors = ["axios", "fetch"]

[queries]
symbols = "queries/symbols.scm"
references = "queries/references.scm"
frameworks = "queries/frameworks.scm"
# Outbound HTTP client-call arm (S-343, CR-108, FR-WS-08): `axios` (receiver-verb
# and object-argument forms) and the `fetch` global, including its verb-less
# spelling. Anchors only — the HTTP-verb and static-literal decisions stay in the
# generic dispatch and `resolve::http_client_call`.
invocations = "queries/invocations.scm"
# Captured `@fw.route.method` text → HTTP method (S-015). Express router
# verbs map to themselves; `all` and `use` (mounting) carry every verb.
[framework_methods]
get = "GET"
post = "POST"
put = "PUT"
delete = "DELETE"
patch = "PATCH"
head = "HEAD"
options = "OPTIONS"
all = "ANY"
use = "ANY"
