# Declarative descriptor for the C# grammar (S-057, CR-009, FR-PL-07, FR-FW-03,
# ADR-09). Embedded via `include_str!` and parsed at startup by the
# LanguageRegistry. Droppable `.scm` query overrides resolve under
# `.logos/plugins/c-sharp/queries/` (FR-PL-04, UAT-PL-03).

name = "c-sharp"
extensions = ["cs"]

# C# joins namespace/type/member segments with a dot — reference extraction
# canonicalises dotted paths into the `::`-joined ledger form.
module_separator = "."

# tree-sitter-c-sharp 0.23.5 is generated against ABI 15 (asserted at load).
abi_version = 15

capabilities = ["symbols", "references", "frameworks", "invocations"]

# Decision-point tokens for the cyclomatic-complexity keyword walk (FR-EX-03):
# the C# control-flow tokens (`foreach` and the `??` null-coalescing operator
# extend the Java set).
complexity_keywords = ["if", "else", "for", "foreach", "while", "do", "case", "catch", "&&", "||", "?", "??"]

# Block-structure nesting node kinds for per-function max nesting depth
# (CR-005, FR-EX-07): the C# control-flow statements. Depth 0 is a flat body;
# each nested statement adds one.
nesting_block_kinds = ["if_statement", "for_statement", "foreach_statement", "while_statement", "do_statement", "switch_statement", "try_statement", "using_statement", "lock_statement"]

# C#'s export rule: an explicit `public` access modifier among the declaration's
# flat `modifier` children (FR-AN-01). Types default to `internal` and members to
# `private`, so `public` is the API root; stricter modifiers are non-roots.
export_convention = "explicit-modifier"

# How C# marks a method as a test (S-057, FR-EX-06, ADR-18): a test attribute in
# an `attribute_list` — `[Fact]`/`[Theory]` (xUnit), `[Test]` (NUnit),
# `[TestMethod]` (MSTest). Feeds the unified `is_test` annotation (S-028).
test_convention = "c-sharp-attributes"

# The ratified C# framework set (FR-FW-03): ASP.NET Core — the `Microsoft.AspNetCore`
# namespace prefix gates framework candidacy (FR-FW-04).
framework_detectors = ["Microsoft::AspNetCore"]

# Canonical reference prefixes whose presence in a file's ledger makes the file an
# outbound **HTTP client-call** candidate (S-346, CR-108, FR-WS-08) — the
# consumer-side twin of `framework_detectors`. `HttpClient` is the whole of
# FR-WS-08's normative C# row, and it lives in `System.Net.Http`.
#
# `using System.Net.Http;` canonicalises to the ledger target `System::Net::Http`,
# and the detector is matched at a SEGMENT BOUNDARY (`resolve::matches_detector`),
# so this row admits `System::Net::Http` and `System::Net::Http::Json` (the
# `GetFromJsonAsync` extensions) while excluding the sibling `System::Net::Sockets`
# / `System::Net::Mail` namespaces. Naming `System::Net` instead would make any
# socket or mail importer a candidate.
#
# This is INDEPENDENT evidence, not a bare identifier: the row is a `using`
# path, and no invocation shape this plugin captures can produce a reference
# target of that form (a method call's ledger target is the bare method name).
# See the rule on `extract::capture_http_client_call_arm`.
#
# Stated ceiling: .NET 6+ `<ImplicitUsings>` puts `System.Net.Http` in the SDK's
# global usings, so a file that never spells the `using` is not a candidate and
# is honestly uncaptured. Under-capture is the safe direction (NFR-RA-05).
http_client_detectors = ["System::Net::Http"]

[queries]
symbols = "queries/symbols.scm"
references = "queries/references.scm"
frameworks = "queries/frameworks.scm"
# Outbound `HttpClient` client-call arm (S-346, CR-108, FR-WS-08): the
# `Async`-suffixed verb methods and the `SendAsync(new HttpRequestMessage(
# HttpMethod.Get, "/p"))` constructor-argument form. See the query header for why
# an ASP.NET Core `MapGet` registration — syntactically the same shape — is not
# read as an outbound call.
invocations = "queries/invocations.scm"
# Captured `@fw.route.method` attribute name → HTTP method (S-057). ASP.NET Core
# verb attributes; `[Route]` declares no single verb.
[framework_methods]
HttpGet = "GET"
HttpPost = "POST"
HttpPut = "PUT"
HttpDelete = "DELETE"
HttpPatch = "PATCH"
HttpHead = "HEAD"
Route = "ANY"

# Captured `@invoke.http.method` text → HTTP method for the CLIENT side (S-346,
# CR-108, FR-WS-08). The mechanism — normalizer, filter, exact-match lookup, and
# why an empty table is a pass-through — is stated once on
# `PluginManifest::invocation_methods`; why the FILTER half is what makes this
# language's receiver-method anchor safe is stated once in the header of
# `queries/invocations.scm`. This block records only what is C#-specific.
#
# C# spells its verbs in two positions, neither of them a bare verb: an `Async`
# SUFFIX on the method name (`GetAsync`), and a NAMED CONSTANT in a constructor
# argument (`HttpMethod.Get`) — the ceiling S-345 deferred to this table.
#
# Deliberately absent: bare-verb identity rows (`Get = "GET"`). Adding them to
# unlock `new HttpRequestMessage(new HttpMethod("GET"), "/p")` would re-admit
# `_cache.Get("/health")` through the method-name anchor — a stated ceiling is
# cheaper than that trade.
[invocation_methods]
# HttpClient's own verb methods.
GetAsync = "GET"
PostAsync = "POST"
PutAsync = "PUT"
DeleteAsync = "DELETE"
PatchAsync = "PATCH"
GetStringAsync = "GET"
GetStreamAsync = "GET"
GetByteArrayAsync = "GET"
# System.Net.Http.Json extension methods — the dominant modern .NET idiom, and
# generic (`GetFromJsonAsync<User>("/users")`), which the query's `generic_name`
# pattern reaches.
GetFromJsonAsync = "GET"
PostAsJsonAsync = "POST"
PutAsJsonAsync = "PUT"
PatchAsJsonAsync = "PATCH"
DeleteFromJsonAsync = "DELETE"
# The named-constant verbs of the `SendAsync` constructor-argument form. The
# capture lands on the whole `member_access_expression`, so the key is the text
# as written.
"HttpMethod.Get" = "GET"
"HttpMethod.Post" = "POST"
"HttpMethod.Put" = "PUT"
"HttpMethod.Delete" = "DELETE"
"HttpMethod.Patch" = "PATCH"
"HttpMethod.Head" = "HEAD"
"HttpMethod.Options" = "OPTIONS"
