# Declarative descriptor for the C++ grammar (S-058, CR-009, FR-PL-01, ADR-09).
# Embedded via `include_str!` and parsed at startup by the LanguageRegistry.
# Droppable `.scm` query overrides resolve under `.logos/plugins/cpp/queries/`
# (FR-PL-04, UAT-PL-03). Pure plugin data over the existing substrate; the only
# core change C++'s idiom required is the bounded `cpp-external-linkage` export
# and `cpp-test-macros` test convention variants (NFR-MA-01, the S-015 pattern).

name = "cpp"

# Disclosed beside this row of `logos languages` and, with the count, on the
# row that reads the headers in `status` of a repository holding both C and
# C++ sources (S-572, S-582, CR-185, FR-PL-07).
note = "`.h` headers are read as C++ in a repository with at least as many C++ sources (`.cpp`, `.cc`, `.cxx`, `.hpp`, `.hh`, `.hxx`) as C sources (`.c`), and as C otherwise."

# The per-repository `.h` rule (S-582, FR-PL-07): C++ claims every C++ source and
# header extension AND the ambiguous `.h`, which the C plugin shares
# (`shared_extensions`). C++ reads `.h` unless the repository's `.c` files
# outnumber its C++ sources; then the C plugin does.
extensions = ["cpp", "cc", "cxx", "hpp", "hh", "hxx", "h"]

# C++ joins namespace/class/member segments with `::` — the canonical ledger
# separator, so reference paths need no rewriting.
module_separator = "::"

# An `#include` names a header by path (S-579, CR-184, FR-RS-38): only `/`
# separates, and the header is named whole, extension included, so `hash.hpp`
# beside `hash.cpp` is no ambiguity. A quoted `#include "x.h"` is read against
# the including file's directory first; it and `#include <a/b.h>` are then read
# against the include roots — every `include/` and `src/` directory, and every
# directory holding an `include/` one — to exactly one file. A header no root
# holds (`<vector>`) is a system header and stays external. A `using` beside
# them is a member path (`references.scm`).
import_specifier = "path"
bare_specifiers = "include-roots"

# tree-sitter-cpp 0.23 is generated against ABI 14 (asserted at load).
abi_version = 14

# No `frameworks` capability: C++ has no single dominant web framework to detect
# (FR-FW-03). `symbols` + `references` drive nodes/edges.
capabilities = ["symbols", "references", "locals"]

# A class's methods read its fields (S-580, FR-EX-22): `this->x` and a bare `x`
# or `m_x` that no parameter or local of the method hides each record an
# `Accesses` edge to the field the class declares, so a C++ class is scored for
# Cohesion. A class declared in a header and defined in a source file is not
# seen from the source (`queries/references.scm`).
member_access = true

# How an unqualified call is read (S-516, CR-169, FR-RS-12): a bare `m()` inside
# a class or struct body is a call on the current instance — recorded with the
# `self` receiver shape and bound among that type's own members only, never
# to a same-named top-level function. Outside one it is a free call, bound by
# the lexical scope (`queries/references.scm`, `@ref.receiver.implicit`).
implicit_receiver = "self"

# Callables overload by name (S-592, FR-RS-43): a bare call binds only a
# callable whose parameter range admits its argument count, and a scope whose
# same-named callables admit none is passed over. Same-arity overloads stay
# `overload-ambiguous`: no argument type is read.
overloaded_calls = true

# Decision-point tokens for the cyclomatic-complexity keyword walk (FR-EX-03) —
# the C-family control-flow set, matching the Java/C# keyword vocabulary plus the
# C++ `goto`.
complexity_keywords = ["if", "else", "for", "while", "do", "case", "catch", "goto", "&&", "||", "?"]

# Block-structure nesting node kinds for per-function max nesting depth (CR-005,
# FR-EX-07): the C++ control-flow statements (`for_range_loop` is the range-for).
nesting_block_kinds = ["if_statement", "for_statement", "for_range_loop", "while_statement", "do_statement", "switch_statement", "try_statement", "catch_clause"]

# Callable body node kinds for the has-body fact (S-500, CR-163, FR-EX-11): a
# Function/Method is implemented when its declaration is, or has a direct
# child of, one of these kinds — a `function_definition`'s `compound_statement` (or its function-try-block
# `try_statement`). A pure-virtual (`= 0`), a `= default`/`= delete` member and a
# prototype (`void f();`, in-class or free) carry none.
body_node_kinds = ["compound_statement", "try_statement"]

# C++ export rule (FR-AN-01): a declaration has external linkage — exported —
# unless `static`-qualified or in an anonymous namespace. The bounded core
# variant this idiom required (C++ default visibility is external, the inverse of
# Java's default-private `public-modifier`).
export_convention = "cpp-external-linkage"

# How C++ marks a function as a test (FR-EX-06, ADR-18): a GoogleTest/Catch2
# function-like test macro (`TEST`/`TEST_F`/`TEST_P`/`TYPED_TEST`, and the Catch2
# `TEST_CASE`/`SCENARIO`). Feeds the unified `is_test` annotation (S-028).
test_convention = "cpp-test-macros"

# Declared cross-file reach (S-570, CR-180, FR-PL-09): an `#include` binds the
# header it names, and a free or qualified call (`f()`, `ns::f()`, `Cls::sf()`)
# and a base class (`class A : public B`) bind through the declarations the
# includes make visible (S-579). A call on `this` binds among its class's
# members and its bases', and so does a call on a receiver whose type the file
# declares (S-581): `o.m()` on a parameter, local or data member declared `T`,
# `T&` or `const T&`, and `p->m()` on one declared `T*`, `std::unique_ptr<T>` or
# `std::shared_ptr<T>`, bind to `T`'s `m` or its nearest base's, across files.
# A call on any other receiver — `auto`, a template parameter, a chain, a data
# member read by an out-of-line method — binds nothing, which is why the level
# stays `partial`.
# Verified by `tests/reach_declared.rs`, which indexes a fixture and fails when a
# declared relation binds nothing across files or an undeclared one does — a
# change that alters this language's reach updates this table in the same change.
[reach]
level = "partial"
cross_file = ["calls", "imports", "type_relations"]

[queries]
symbols = "queries/symbols.scm"
references = "queries/references.scm"
# The names a callable body binds locally, each with its kind, scope and
# position (S-593, CR-191, FR-EX-33): facts only, read by no edge.
locals = "queries/locals.scm"
