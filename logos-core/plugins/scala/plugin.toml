# Declarative descriptor for the Scala grammar (S-061, CR-009, FR-PL-01,
# FR-PL-07, ADR-09). Embedded via `include_str!` and parsed at startup by the
# LanguageRegistry. Droppable `.scm` query overrides resolve under
# `.logos/plugins/scala/queries/` (FR-PL-04, UAT-PL-03).
#
# Scala is the highest-risk grammar of the language-breadth set, so this story
# is gated on a verification preflight (crate resolves / grammar loads at the
# workspace ABI / queries compile / fixture corpus parses — CR-009 CRA-01); a
# preflight failure defers Scala alone. `tree-sitter-scala` 0.26 is generated
# against ABI 15, asserted at load against the tree-sitter 0.25 runtime's
# [13,15] range (FR-PL-02, abi::assert_abi).

name = "scala"
extensions = ["scala", "sc"]

# Scala joins package/member segments with a dot — reference extraction
# canonicalises dotted paths into the `::`-joined ledger form.
module_separator = "."

# tree-sitter-scala 0.26 is generated against ABI 15.
abi_version = 15

# No `frameworks` capability: Scala ships no dominant-framework detector in this
# increment (the Play/Akka split has no single annotation idiom analogous to
# Spring) — an honest absence, not a stub (CR-009).
capabilities = ["symbols", "references", "locals"]

# The optional member-access capability (S-575, CR-183, FR-EX-28, FR-QM-11,
# ADR-39): Cohesion scores a class only in a language that declares it. Scala's
# queries capture `this.x` and the bare forms — `semaphore.acquire(n)`,
# `rate - n`, `s"$label"` — as `Accesses` edges (`queries/references.scm`,
# `@ref.access` and `@ref.access.bare`), and a class's constructor parameters
# are its fields (`queries/symbols.scm`), so its classes' LCOM4 has its
# shared-field links. Stated ceilings: a field a class inherits, or an outer
# class declares, adds no link, and a name any local of the method declares
# hides the field in the whole method.
member_access = true

# A supertype's kind follows the type it binds (S-575, FR-RS-15): `extends A
# with B with C` names a base class and mixed-in traits alike — a trait may
# head the clause, and a class needs no `with` — so each entry is captured
# once and its edge is `Extends` to the class it binds, `Implements` to a trait.
# An `object` is never a supertype, so a trait and its companion `object` name
# the trait; a class and its companion stay unbound — both are classes here.
supertype_kind_follows_target = true

# A trait with a bodied method is a container (S-575, CR-183, FR-QM-11): Scala
# writes state and behaviour into traits (the cake pattern's service traits),
# so such a trait counts for Focus and, under `member_access`, for Cohesion, as
# a class does. A trait of abstract declarations only is no container.
bodied_traits_are_containers = true

# How an unqualified call is read (S-516, CR-169, FR-RS-12): a bare `m()` inside
# a class, object or trait is a call on the current instance — recorded with the
# `self` receiver shape and bound among that type's own members only, never
# to a same-named top-level function. Outside one it is a free call, bound by
# the lexical scope (`queries/references.scm`, `@ref.receiver.implicit`). Inside
# one that neither inherits nor declares the name (nor is a case class, an enum
# or an anonymous `new T { … }`), where the file binds no value of it, it is a
# free call too (S-573, `@ref.implicit.*`): the member that would
# hide the imports and the package is shown absent.
implicit_receiver = "self"

# Callables overload by name (S-592, FR-RS-43): a bare call binds only a
# callable whose parameter range admits its argument count, and a scope whose
# same-named callables admit none is passed over. Same-arity overloads stay
# `overload-ambiguous`: no argument type is read.
overloaded_calls = true

# Calling a class constructs it (S-521, CR-170, FR-RS-16): a free `Foo()` whose
# one candidate is a class records `Instantiates` to it. A class and its
# companion `object` are both captured as classes, so `Foo()` naming the pair
# stays unbound; so does a bare `Foo()` inside a class, read as a call on the
# current instance (above) — unless the file shows no member answers it
# (S-573, `queries/references.scm`, `@ref.implicit.*`), which makes it free.
class_call_instantiates = true

# Decision-point tokens for the cyclomatic-complexity keyword walk (FR-EX-03).
# Each `case` (match arms, `catch` arms, partial functions) is a branch; the
# boolean operators and the loop/conditional keywords mirror the Java set.
complexity_keywords = ["if", "else", "for", "while", "do", "case", "catch", "&&", "||"]

# Block-structure nesting node kinds for per-function max nesting depth
# (CR-005, FR-EX-07): Scala's control-flow constructs are *expressions*. Depth 0
# is a flat body; each nested such expression adds one.
nesting_block_kinds = ["if_expression", "for_expression", "while_expression", "do_while_expression", "match_expression", "try_expression"]

# Callable body node kinds for the has-body fact (S-500, CR-163, FR-EX-11): a
# Function/Method is implemented when its declaration is, or has a direct
# child of, one of these kinds — Scala tells the two apart by node kind: a `def` with a body is a
# `function_definition` (its body may be any expression, so no child kind
# names it), and an abstract `def` is a `function_declaration`.
body_node_kinds = ["function_definition"]

# Scala's export rule: public-by-default — a declaration is exported unless a
# `modifiers` child carries an `access_modifier` (`private`/`protected`,
# including package-scoped `private[pkg]`). The inverse of Java's `public`-token
# rule (FR-AN-01 — `private`/`protected` are non-roots).
export_convention = "public-default"

# How Scala marks a function as a test (S-061, FR-EX-06, ADR-18): the munit /
# ScalaTest (`FunSuite`/`FunSpec`) idiom, where a test case is a
# `test("name") { … }` / `it("name") { … }` *call* rather than a declaration.
# Evidence attaches to the marker call and to any callable lexically enclosed by
# it. Best-effort and positive-evidence-only.
test_convention = "scala-test"

# A Scala file's module identity is the package it DECLARES, not its path
# (S-518, CR-170, FR-RS-13): its `symbols` query captures the declaration's name
# with `@module.namespace`, and each top-level type is named that package plus its
# own name (`resolve::package_key`). Imports bind through that fully-qualified
# name, so a package that differs from its directory still binds; a type
# declared twice under one name binds neither (NFR-RA-05).
# `family = "jvm"` (S-519, NFR-RA-05): Java, Kotlin and Scala name each other's
# types, so they share one interop family — the fully-qualified type index and
# the namespace-files index reach only targets of the source's own family, and a
# C# `using` never binds a PHP namespace of the same spelling.
# A class and its companion `object` are one name (S-573, FR-RS-36): a call on
# the name binds among the object's methods (`queries/symbols.scm` marks them as
# taking no instance receiver), never the class's, and a path or wildcard
# through the name reads both. The name itself still names two declarations, so
# an import of it or a `new` of it binds neither (NFR-RA-05).
# A Scala 3 top-level `def` is a member of its file's package (S-573), as the
# package's types are: an import names it, `import ox.*` brings it into view,
# and a free call from the same package reaches it.
# A name a wildcard import brings into view outranks one the package declares in
# another file (S-573): Scala's precedence, where Java reads the package first.
[module_model]
kind = "namespace"
family = "jvm"
companion_objects = true
top_level_callables = true
wildcards_outrank_package = true

# Declared cross-file reach (S-570, CR-180, FR-PL-09): imports bind across
# files through the declared package (S-518). A call on an object
# (`StringUtil.decode(t)`), a call to a top-level `def` through an import, a
# wildcard or the package, and a bare call no member of its class answers bind
# across files (S-573), and so does a call `x.m(…)` on a receiver whose type the
# file declares — a class parameter, a `val`/`var`, a parameter, `val x = new
# T(…)` (S-576), among that class's own methods, never its companion object's.
# A call on any other receiver — an untyped lambda or pattern
# variable, `val x = make()`, a chain — and a parameterless selection `x.m`,
# which may read a field, bind in no file, which is why the level stays
# `partial`. Of the type relations, the `Instantiates` a top-level `Foo()`
# (S-521) or a `new Foo(…)` (S-573) records binds across files, and so does
# each `extends`/`with` supertype (S-575). A field access binds only inside the
# class, and so inside its file.
# Verified by `tests/reach_declared.rs`, which indexes a fixture and fails when a
# declared relation binds nothing across files or an undeclared one does — a
# change that alters this language's reach updates this table in the same change.
[reach]
level = "partial"
cross_file = ["calls", "imports", "type_relations"]

[queries]
symbols = "queries/symbols.scm"
references = "queries/references.scm"
# The names a callable body binds locally, each with its kind, scope and
# position (S-593, CR-191, FR-EX-33): facts only, read by no edge.
locals = "queries/locals.scm"
