name: Feature request
description: Propose a change or an addition
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem before the solution. A maintainer reviews each
        request; an accepted one is planned as a change request and its stories,
        and the same issue is kept. See
        [CONTRIBUTING.md](https://github.com/raffaelecamanzo/logos/blob/main/CONTRIBUTING.md).
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: What should happen instead. Commands, output and examples help.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: How we would know it works
      description: Observable checks that would show the request is met.
      placeholder: |
        - Running `logos ...` prints ...
        - ...
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, or how you work around it now. Optional.
  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to implement it?
      options:
        - "No"
        - "Yes, I can open a pull request"
        - "Yes, with guidance"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
