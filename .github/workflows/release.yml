# * checks for a Git Tag that looks like a release
# * builds artifacts with dist (archives, installers, hashes)
# * uploads those artifacts to temporary workflow zip
# * on success, uploads the artifacts to a GitHub Release
#
# Note that the GitHub Release will be created with a generated
# title/body based on your changelogs.
#
# ── This repository's customisations (never run `dist init` or `dist generate`) ─
# dist-workspace.toml sets `allow-dirty = ["ci"]`, so dist accepts this file as
# edited. Until the first release built outside this repository takes over the
# release names, a release tag here publishes the binaries this repository builds
# (S-732); docs/howto/ci-integration.md describes that release train. The edits:
#   * `build-spa` builds the web UI once and every build job embeds it (CR-049).
#   * `workflow_dispatch` releases an EXISTING tag, named by the `tag` input, so a
#     tag cut before this pipeline returned can still be released. `plan` and
#     `host` check out that tag, and every build job the commit `plan` validated
#     (`needs.plan.outputs.commit`), never the branch the run was dispatched from.
#   * scripts/release-tag-guard.sh runs in `plan` before dist is installed and
#     again in `host` just before the GitHub Release is created: it refuses a tag
#     that is not vMAJOR.MINOR.PATCH[-SUFFIX], is not the checkout, or already has
#     a GitHub Release; in `host` it also refuses a tag that no longer points at
#     the validated commit. The tag reaches later jobs only through its output.
#   * Each job that runs dist checks the workflow's own commit out beside the tag
#     (.release-pipeline) and runs scripts/release-dist-config.sh, which supplies
#     the dist configuration a tag cut without it lacks and changes nothing on a
#     tag that has it.
