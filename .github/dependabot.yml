# Dependabot proposes bumps for the three things this repository pins: the actions
# .github/workflows/ci.yml and .github/workflows/release.yml pin to a commit
# (NFR-MA-10), the Cargo.lock at the root, and the web UI's package-lock.json in
# web/ui. Only the owner merges these pull requests (docs/howto/contributing.md).
# A github-actions bump rewrites the commit and the trailing `# vX.Y.Z` comment
# together; the pin check in scripts/tests/test-ci-pins.sh confirms both are still
# there and well formed in both workflows, and that this file keeps all three
# ecosystems, each weekly with a cooldown. The cooldown holds a release back before
# a pull request is opened, so a hijacked release that is pulled quickly is never
# proposed. release.yml is customised on top of cargo-dist's output: see "CI actions
# are pinned" in docs/howto/contributing.md before merging a bump to it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: npm
    directory: /web/ui
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
